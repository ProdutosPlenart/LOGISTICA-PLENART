<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF4; --line:#D3DAE4; --line-strong:#AEB9C8;
  --ink:#1B2430; --muted:#5B6878; --faint:#8C98A8;
  --navy:#1F3B63; --blue:#2E75B6; --orange:#E8741A; --teal:#2A9D8F; --on-accent:#FFFFFF;
  --blue-soft:#DDEBF7; --orange-soft:#FDE9D9; --grey-soft:#E8ECF1; --grey-head:#8E98A6;
  --ph-mon:#2E75B6; --ph-des:#1F3B63; --ph-ev:#F5B27A;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#B8621B; --warn-soft:#FFEBD6; --danger:#B93A2F; --danger-soft:#FADDD9;
  --focus:#2E75B6; --shadow:0 10px 30px rgba(20,35,60,.16); --scrim:rgba(15,21,30,.42);
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151E; --surface:#161E2A; --surface-2:#1D2735; --line:#2B3747; --line-strong:#41506A;
    --ink:#E7ECF3; --muted:#A5B0C0; --faint:#6E7B8C;
    --navy:#2B4F82; --blue:#3C86CC; --orange:#F08334; --teal:#3FB8A8; --on-accent:#FFFFFF;
    --blue-soft:#1F3450; --orange-soft:#42301F; --grey-soft:#232E3C; --grey-head:#5C6878;
    --ph-mon:#3C86CC; --ph-des:#7FA4D1; --ph-ev:#7A4A28;
    --ok:#5CBF86; --ok-soft:#1E3A2B; --warn:#F0A04B; --warn-soft:#42301A; --danger:#EF7B6D; --danger-soft:#47231F;
    --focus:#6FB1F2; --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#161E2A; --surface-2:#1D2735; --line:#2B3747; --line-strong:#41506A;
  --ink:#E7ECF3; --muted:#A5B0C0; --faint:#6E7B8C;
  --navy:#2B4F82; --blue:#3C86CC; --orange:#F08334; --teal:#3FB8A8; --on-accent:#FFFFFF;
  --blue-soft:#1F3450; --orange-soft:#42301F; --grey-soft:#232E3C; --grey-head:#5C6878;
  --ph-mon:#3C86CC; --ph-des:#7FA4D1; --ph-ev:#7A4A28;
  --ok:#5CBF86; --ok-soft:#1E3A2B; --warn:#F0A04B; --warn-soft:#42301A; --danger:#EF7B6D; --danger-soft:#47231F;
  --focus:#6FB1F2; --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-inline:16px;padding-block:14px 56px;width:100%;max-width:1600px;margin:0 auto}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding-bottom:12px;border-bottom:2px solid var(--navy)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:26px;height:26px;flex:none}
.mark i{display:block;background:var(--navy)}
.mark i:nth-child(2),.mark i:nth-child(3){background:var(--orange)}
.mark i:nth-child(4){background:var(--blue)}
.brand h1{margin:0;font:700 26px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--navy)}
.brand .sub{margin:3px 0 0;font:600 11.5px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:3px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 14px;font:700 13px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab.on{background:var(--navy);color:var(--on-accent)}
.tab .n{display:inline-block;min-width:18px;margin-left:5px;padding:1px 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:10.5px;text-align:center}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 14px;font:700 12.5px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.banner{margin-top:10px;padding:8px 12px;border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--ink);font:600 12px/1.35 var(--cond);letter-spacing:.05em;text-transform:uppercase}
.banner.info{border-left-color:var(--blue);background:var(--blue-soft)}
.statusline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;font:600 11.5px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.statusline .spacer{flex:1}
.statusline .btn.sm{font-size:10.5px;padding:3px 8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.db{background:var(--ok)} .dot.local{background:var(--warn)} .dot.error{background:var(--danger)}
#saveTxt.ok{color:var(--ok)} #saveTxt.bad{color:var(--danger)}
main{margin-top:12px}

/* barra de ferramentas */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.toolbar .spacer{flex:1}
.toolbar.sub{margin-top:-4px}
.search{flex:1 1 220px;max-width:360px;padding:7px 10px;border:1px solid var(--line-strong);background:var(--surface);border-radius:2px;text-transform:uppercase}
.search::placeholder{text-transform:none;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);padding:4px 10px;font:600 11px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.chip:disabled{opacity:.5;cursor:default}
.lbl{font:700 11px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sel{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sel select{padding:5px 8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:2px;font:600 12px/1.2 var(--cond);letter-spacing:.04em;text-transform:uppercase;max-width:230px}
.toolbar .seg{flex:none}
.toolbar .seg button{flex:0 0 auto;padding:7px 12px 6px}
.emptymsg{padding:22px 16px;border:1px dashed var(--line-strong);background:var(--surface);color:var(--muted);font:600 13px/1.45 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.emptymsg b{color:var(--orange)}
.hint{margin:6px 0 0;font:500 12px/1.4 var(--body);color:var(--muted)}

/* status */
.st{display:inline-block;padding:2px 7px;font:700 10.5px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.st-grey{background:var(--grey-soft);color:var(--muted);border-color:var(--line-strong)}
.st-blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.st-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.st-orange{background:var(--orange-soft);color:var(--orange);border-color:var(--orange)}
.st-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.st-navy{background:var(--navy);color:var(--on-accent);border-color:var(--navy)}
.st-bad{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.st-muted{background:transparent;color:var(--faint);border-color:var(--line);text-decoration:line-through}
select.stsel{padding:3px 6px;border:1px solid var(--line-strong);border-radius:2px;font:700 11px/1.2 var(--cond);letter-spacing:.05em;text-transform:uppercase;background:var(--surface);cursor:pointer;max-width:150px}
select.stsel.s-PROGRAMADO,select.stsel.s-PROGRAMADA{color:var(--muted)}
select.stsel.s-CARREGANDO{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
select.stsel.s-CARREGADO{color:var(--navy);border-color:var(--navy);background:var(--blue-soft)}
select.stsel.s-SAIU{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
select.stsel.s-ENTREGUE,select.stsel.s-NO-EVENTO{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
select.stsel.s-VOLTOU{color:var(--ok);border-color:var(--line-strong)}
select.stsel.s-CANCELADO,select.stsel.s-CANCELADA{color:var(--faint);text-decoration:line-through}

/* lista de eventos */
.tablewrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);max-width:100%}
table.lst{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;font-size:13px}
.lst th,.lst td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.lst th{background:var(--navy);color:var(--on-accent);font:700 11.5px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;border-right-color:rgba(255,255,255,.3);white-space:nowrap}
.lst th.n,.lst td.n{text-align:center}
.lst td.n{font:700 14px/1.2 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink)}
.lst td.n small{display:block;font:600 10.5px/1.2 var(--cond);letter-spacing:.04em;color:var(--muted)}
.lst td.n.zero{color:var(--faint);font-weight:600}
.lst tbody tr{cursor:pointer}
.lst tbody tr:hover td{background:var(--surface-2)}
.lst td.ev{font:700 13.5px/1.2 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.lst td.ev small{display:block;margin-top:2px;font:500 11px/1.25 var(--body);letter-spacing:0;color:var(--muted);text-transform:uppercase}
.lst td.date{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.lst td.prox{font:600 12px/1.3 var(--cond);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.lst td.prox b{color:var(--navy)}
.lst td.avs .st{margin:0 4px 4px 0}
.lst tr.arch td{opacity:.6}
.dsw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--evc,var(--navy));margin-right:6px;vertical-align:baseline}

/* lista de eventos: grupos e cartões */
.egh{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font:700 13.5px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.toolbar+.egh{margin-top:2px}
.egh i{font-style:normal;background:var(--orange);color:#fff;min-width:20px;text-align:center;padding:1px 6px;border-radius:9px;font-size:11px;letter-spacing:0}
.evl{display:flex;flex-direction:column;gap:8px}
.evrow{display:grid;grid-template-columns:minmax(210px,1.1fr) minmax(250px,1.5fr) minmax(200px,.95fr);gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--evc,var(--navy));padding:9px 12px;cursor:pointer}
.evrow:hover{border-color:var(--line-strong);box-shadow:0 2px 10px rgba(20,35,60,.08)}
.evrow.arch{opacity:.6}
.evi{min-width:0}
.evi b{display:block;font:700 15.5px/1.15 var(--cond);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.evi small{display:block;margin-top:2px;font:500 11px/1.3 var(--body);color:var(--muted);text-transform:uppercase;overflow-wrap:anywhere}
.evi small.prod{color:var(--blue);font-weight:600}
.evds{display:flex;flex-wrap:wrap;gap:4px;align-content:center}
.evc2{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line-strong);border-radius:2px;background:var(--surface-2);font:700 10.5px/1.5 var(--cond);letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.evc2.c-mon{border-color:var(--ph-mon);color:var(--ph-mon)}
.evc2.c-ev{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.evc2.c-des{border-color:var(--teal);color:var(--teal)}
.evc2.on{box-shadow:inset 0 0 0 1px currentColor}
.evc2 i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.evc2.mut{color:var(--faint)}
.evst{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.evb{display:inline-block;padding:3px 9px;border-radius:2px;font:700 11px/1.3 var(--cond);letter-spacing:.07em;text-transform:uppercase;color:#fff}
.b-mont{background:var(--blue)} .b-ev{background:var(--orange)} .b-desm{background:var(--ok)}
.b-par{background:var(--grey-head)}
.b-prox{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong)}
.cnt2{font:600 11.5px/1.3 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.prox2{font:600 11.5px/1.3 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.prox2 b{color:var(--navy)}
.avs2{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:980px){ .evrow{grid-template-columns:minmax(0,1fr)} .evst{flex-direction:row;flex-wrap:wrap;align-items:center} }

/* evento */
.dtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.dtop .spacer{flex:1}
.evhead{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);padding:12px 14px 12px}
.evhead h2{margin:0 0 6px;font:700 24px/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase;color:var(--navy);overflow-wrap:anywhere}
.evhead .ro{font:600 10.5px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-left:8px;white-space:nowrap}
.evdates{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}
.evd{background:var(--surface-2);border-top:3px solid var(--ph-mon);padding:6px 9px}
.evd.ev{border-top-color:var(--orange)} .evd.des{border-top-color:var(--ph-des)}
.evd span{display:block;font:700 10px/1.2 var(--cond);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.evd b{display:block;font:700 15px/1.25 var(--cond);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.evmeta{display:flex;flex-direction:column;gap:3px;font-size:13px;text-transform:uppercase}
.evmeta div{overflow-wrap:anywhere}
.evmeta b{font:700 11px/1.2 var(--cond);letter-spacing:.08em;color:var(--muted);margin-right:6px}
.maplink{font:700 11px/1 var(--cond);letter-spacing:.06em;color:var(--blue);text-decoration:none;margin-left:6px;white-space:nowrap}
.maplink:hover{text-decoration:underline}

.box{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--navy);padding:10px 14px 10px}
.box.prev{border-left-color:var(--teal)}
.box.trips{border-left-color:var(--navy)}
.box.eqs{border-left-color:var(--orange)}
.box.cars{border-left-color:var(--blue)}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
.bhead h3{margin:0;font:700 14px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.bhead .cnt{font:600 11.5px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bhead .spacer{flex:1}
.bhead small{flex-basis:100%;font:500 12px/1.35 var(--body);color:var(--muted)}
.pempty{font:600 11.5px/1.35 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:2px 0 4px}
.pgrp{font:700 10.5px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:8px 0 4px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 8px;border:1px solid var(--line);border-left:3px solid var(--teal);background:var(--surface);margin-bottom:5px;font-size:13px;text-transform:uppercase}
.prow b{font:700 13.5px/1.2 var(--cond);letter-spacing:.03em}
.prow .pd{color:var(--muted);font-size:12px}
.prow .spacer{flex:1}
.prow.done{border-left-color:var(--ok);background:var(--ok-soft)}
.prow .ok{font:700 11px/1.2 var(--cond);letter-spacing:.06em;color:var(--ok);white-space:nowrap}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px}
.card{position:relative;border:1px solid var(--line);border-left:4px solid var(--navy);background:var(--surface);padding:8px 10px 8px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--line-strong);box-shadow:0 2px 10px rgba(20,35,60,.08)}
.card.traz{border-left-color:var(--ph-des)}
.card.leva{border-left-color:var(--orange)}
.card.eq{border-left-color:var(--orange)}
.card.car{border-left-color:var(--blue)}
.card.cancel{opacity:.55}
.card.cancel .ch b{text-decoration:line-through}
.ch{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.ch .tt{flex:1;min-width:0}
.ch b{display:block;font:700 15px/1.15 var(--cond);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.ch small{display:block;font:600 11.5px/1.25 var(--cond);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.sent{display:inline-block;font:700 10px/1 var(--cond);letter-spacing:.08em;padding:3px 6px 2px;border-radius:2px;text-transform:uppercase;vertical-align:2px;margin-right:6px;color:#fff;background:var(--orange)}
.sent.traz{background:var(--ph-des)} .sent.eq{background:var(--warn)} .sent.car{background:var(--blue)}
.tag{display:inline-block;font:700 9.5px/1 var(--cond);letter-spacing:.06em;padding:2px 5px;border:1px solid var(--line-strong);border-radius:2px;color:var(--muted);text-transform:uppercase;margin-left:4px;vertical-align:2px}
.tag.o{border-color:var(--orange);color:var(--orange)} .tag.b{border-color:var(--blue);color:var(--blue)}
.cl{display:flex;gap:8px;font-size:12.5px;line-height:1.35;text-transform:uppercase;padding:2px 0}
.cl>span:first-child{flex:0 0 66px;font:700 10.5px/1.6 var(--cond);letter-spacing:.08em;color:var(--muted)}
.cl>div{flex:1;min-width:0;overflow-wrap:anywhere}
.cl b{font-weight:700;font-variant-numeric:tabular-nums}
.cl .mut{color:var(--faint)}
.av{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.avl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:3px 7px;font:600 11.5px/1.3 var(--cond);letter-spacing:.04em;text-transform:uppercase;border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--ink)}
.avl.bad{border-left-color:var(--danger);background:var(--danger-soft)}
.avl.info{border-left-color:var(--line-strong);background:var(--surface-2);color:var(--muted)}

/* períodos (dia / semana) */
.pnav{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pnav .plbl{font:700 15px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--navy);min-width:150px;text-align:center}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.wkd{border:1px solid var(--line);background:var(--surface);padding:5px 4px 6px;text-align:center;cursor:pointer;border-radius:2px;min-width:0}
.wkd b{display:block;font:700 15px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.wkd span{display:block;font:600 10px/1.2 var(--cond);letter-spacing:.08em;color:var(--muted)}
.wkd i{display:inline-block;min-width:18px;margin-top:3px;padding:1px 5px;border-radius:9px;background:var(--grey-soft);color:var(--muted);font:700 10.5px/1.3 var(--cond);font-style:normal}
.wkd.has i{background:var(--orange);color:#fff}

.wkd.on{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.wkd.on span{color:rgba(255,255,255,.75)}
.wkd.we{background:var(--surface-2)}
.wk.mes .wkd{padding:3px 2px 4px}
.wk.mes .wkd b{font-size:13px}
.wk.mes .wkd i{margin-top:1px}
.wkd.on.we{background:var(--navy)}

/* cronogramas */
.dgrp{margin-bottom:14px}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;background:var(--navy);color:var(--on-accent);padding:6px 10px}
.dh b{font:700 15px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.dh span{font:600 11.5px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.dh.sem{background:var(--warn)}
.dsub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px 10px;margin-top:6px;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--navy)}
.dsub.dsub-ev{border-left-color:var(--orange)}
.dsub.dsub-out{border-left-color:var(--teal)}
.seg.onde .segl{align-self:center;padding:0 8px 0 4px;font:700 10.5px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dsub b{font:700 12.5px/1.2 var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.dsub span{font:600 11px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dsub .spacer{flex:1}
.dsub .btn.sm{padding:2px 8px;font-size:10.5px}
.dh+.dsub,.empsum+.dsub{margin-top:0}
.empsum{display:flex;flex-wrap:wrap;gap:4px 14px;padding:5px 10px;background:var(--orange-soft);border:1px solid var(--line);border-top:0;font:600 11.5px/1.35 var(--cond);letter-spacing:.04em;text-transform:uppercase}

.empsum .bad{color:var(--danger)}

.rw{display:grid;gap:4px 12px;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.rw:first-child{border-top:0}
.rw:hover{background:var(--surface-2)}
.rw.cancel{opacity:.5}
.rw.car{grid-template-columns:62px minmax(170px,1.2fr) minmax(170px,1.2fr) minmax(180px,1.6fr) minmax(120px,.9fr) minmax(130px,.9fr) 132px}
.rw.sai{grid-template-columns:62px 92px minmax(170px,1.2fr) minmax(190px,1.5fr) minmax(190px,1.6fr) minmax(120px,.9fr) 132px}
.rw .hr{font:700 18px/1.1 var(--cond);font-variant-numeric:tabular-nums;color:var(--navy)}
.rw .hr.sem{font-size:11px;color:var(--faint);letter-spacing:.06em;padding-top:3px}
.rw .c{min-width:0;font-size:12.5px;line-height:1.35;text-transform:uppercase;overflow-wrap:anywhere}
.rw .c b{display:block;font:700 13.5px/1.2 var(--cond);letter-spacing:.03em}
.rw .c small{display:block;color:var(--muted);font-size:11.5px}
.rw .c .k{display:none;font:700 10px/1.2 var(--cond);letter-spacing:.08em;color:var(--muted)}
.rw .c.evc b{padding-left:8px;border-left:3px solid var(--evc,var(--navy))}
.rw .stc{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rw .avl{grid-column:1/-1}
.rw .tp{font:700 10.5px/1.3 var(--cond);letter-spacing:.06em;text-transform:uppercase}

/* quadro (kanban) */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);min-height:120px;display:flex;flex-direction:column}
.kcol.over{outline:2px dashed var(--orange);outline-offset:-3px}
.kh{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;font:700 12px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--grey-head)}
.kh.k-CARREGANDO{background:var(--warn)} .kh.k-CARREGADO{background:var(--navy)} .kh.k-SAIU{background:var(--blue)} .kh.k-ENTREGUE{background:var(--ok)} .kh.k-VOLTOU{background:var(--teal)}
.kh i{font-style:normal;background:rgba(255,255,255,.25);padding:1px 7px;border-radius:9px}
.kbody{padding:6px;display:flex;flex-direction:column;gap:6px;flex:1}
.kc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--evc,var(--navy));padding:6px 8px;cursor:grab;font-size:12px;text-transform:uppercase}
.kc.dragging{opacity:.5}
.kc .t1{display:flex;gap:6px;align-items:baseline}
.kc .t1 b{font:700 15px/1.1 var(--cond);font-variant-numeric:tabular-nums;color:var(--navy);white-space:nowrap;flex:none}

.kc .t3{font:600 11px/1.25 var(--cond);letter-spacing:.03em;margin-top:2px}
.kc .ka{display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.kc .ka button{flex:0 1 auto;min-width:0;border:1px solid var(--line-strong);background:var(--surface);font:700 10.5px/1 var(--cond);letter-spacing:.04em;padding:5px 6px;cursor:pointer;border-radius:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .ka button:hover{border-color:var(--navy)}
.kc .ka button:disabled{visibility:hidden}
.kc .ka .kp{flex:none;width:30px}
.kc .ka .kn{flex:1 1 auto}

/* frota */
.fwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table.fq{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}
.fq th,.fq td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.fq th.nm,.fq td.nm{position:sticky;left:0;z-index:2;background:var(--surface);width:210px;min-width:210px;max-width:210px;text-align:left;padding:5px 9px;border-right:2px solid var(--line-strong)}
.fq thead th{background:var(--blue-soft);font:700 11px/1.1 var(--cond);text-align:center;padding:4px 0;font-variant-numeric:tabular-nums;color:var(--ink)}
.fq thead th small{display:block;font:600 9.5px/1.1 var(--cond);color:var(--muted);letter-spacing:.04em}
.fq thead th.we{background:var(--grey-soft)}
.fq thead th.today{box-shadow:inset 0 -3px 0 var(--orange)}
.fq thead th.nm{background:var(--navy);color:var(--on-accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.fq td.nm b{display:block;font:700 12.5px/1.15 var(--cond);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fq td.nm small{display:block;font:500 10.5px/1.2 var(--body);color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fq tr.grp td{background:var(--navy);color:var(--on-accent);font:700 11.5px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;position:sticky;left:0}
.fq td.d{width:58px;min-width:58px;height:40px;vertical-align:middle;text-align:center;position:relative}
.fq td.d.we{background:var(--surface-2)}
.fq td.d.today{box-shadow:inset 2px 0 0 var(--orange),inset -2px 0 0 var(--orange)}
.fc{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;height:100%;min-height:38px;padding:2px 2px;cursor:pointer;font:700 10.5px/1.05 var(--cond);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;border-left:3px solid var(--evc,var(--navy));background:color-mix(in srgb,var(--evc,var(--navy)) 18%,var(--surface))}
.fc small{font:700 9px/1 var(--cond);letter-spacing:.06em;color:var(--muted)}
.fc.prev{border-left-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--evc,var(--navy)) 14%,var(--surface)) 0 4px,var(--surface) 4px 8px)}
.fc.multi{border-left-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.fc.bad{border-left-color:var(--danger);background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
.fc.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.flegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font:600 11px/1.3 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.flegend span{display:inline-flex;align-items:center;gap:5px}
.flegend i{display:inline-block;width:14px;height:12px;border-left:3px solid var(--evc,var(--navy));background:color-mix(in srgb,var(--evc,var(--navy)) 18%,var(--surface))}
.flegend i.prev{border-left-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--navy) 18%,var(--surface)) 0 3px,var(--surface) 3px 6px)}
.flegend i.bad{border-left-color:var(--danger);background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--danger)}
.flegend i.multi{border-left-color:var(--warn);background:var(--warn-soft)}
.facts{font:600 11px/1.4 var(--cond);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.facts b{color:var(--ink)}

/* painel lateral */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);color:var(--ink);z-index:41;overflow-y:auto;overscroll-behavior:contain;border-left:1px solid var(--line);box-shadow:-10px 0 34px rgba(0,0,0,.18);font:400 14px/1.45 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-head{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:2px solid var(--orange);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.p-head .p-k{font:700 11px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.p-head h2{margin:0;font:700 21px/1.1 var(--cond);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere;color:var(--navy)}
.p-head .evlink{background:none;border:0;padding:0;text-align:left;font:600 12.5px/1.3 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--blue);cursor:pointer;overflow-wrap:anywhere}
.p-head .evlink:hover{text-decoration:underline}
.p-head .si{font:600 10.5px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.p-head .si.ok{color:var(--ok)} .p-head .si.bad{color:var(--danger)}
.x{background:transparent;border:1px solid var(--line);border-radius:4px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink);cursor:pointer;font-size:20px;line-height:1}
.p-body{display:flex;flex-direction:column;gap:12px;padding:12px 16px 30px}
.psec{border:1px solid var(--line);border-left:4px solid var(--navy);padding:9px 10px 10px;display:flex;flex-direction:column;gap:8px}
.psec.o{border-left-color:var(--orange)} .psec.b{border-left-color:var(--blue)} .psec.t{border-left-color:var(--teal)} .psec.d{border-left-color:var(--ph-des)}
.psec>h3{margin:0;font:700 12px/1.2 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.g3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:700 10.5px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--ink);font:500 14px/1.3 var(--body);padding:7px 9px;text-transform:uppercase}
.fld textarea{resize:vertical;min-height:62px}
.fld input::placeholder,.fld textarea::placeholder{text-transform:none;color:var(--faint)}
.fld input.bad{border-color:var(--danger);background:var(--danger-soft)}
.fld input.dt,.fld input.hr{font-variant-numeric:tabular-nums}
.qd{display:flex;flex-wrap:wrap;gap:4px}
.qd .chip{padding:3px 7px;font-size:10.5px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.seg button{flex:1;min-width:0;border:0;border-right:1px solid var(--line-strong);background:var(--surface);color:var(--muted);padding:8px 4px 7px;font:700 12.5px/1.15 var(--cond);letter-spacing:.06em;cursor:pointer;text-transform:uppercase}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:var(--on-accent)}
.pickw{display:flex;flex-direction:column;gap:6px}
.pickw select,.pickw input{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--ink);font:600 14px/1.3 var(--body);padding:7px 9px;text-transform:uppercase}
.pickw select{border-left:3px solid var(--navy)}
.pickw input{border-left:3px solid var(--orange)}
.pickw input::placeholder{text-transform:none;color:var(--faint)}
.p-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.p-foot .spacer{flex:1}
.p-who{font:500 11.5px/1.35 var(--body);color:var(--faint)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--danger);background:var(--danger-soft);font:700 12px/1.3 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--danger)}
.newg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.newg button{border:1px solid var(--line-strong);background:var(--surface);padding:12px 10px;text-align:left;cursor:pointer;border-left:4px solid var(--navy);border-radius:2px}
.newg button b{display:block;font:700 15px/1.15 var(--cond);letter-spacing:.04em;text-transform:uppercase}
.newg button small{display:block;font:500 12px/1.3 var(--body);color:var(--muted);margin-top:3px}
.newg button.on{background:var(--blue-soft);border-color:var(--navy)}
.newg button.k-LEVA{border-left-color:var(--orange)} .newg button.k-TRAZ{border-left-color:var(--ph-des)} .newg button.k-EQUIP{border-left-color:var(--warn)} .newg button.k-CARRO{border-left-color:var(--blue)}
/* dias do carro */
.dpk{display:flex;flex-direction:column;gap:6px}
.dpk .mo{font:700 10.5px/1.2 var(--cond);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.dpk .gr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dpk .wd{font:700 9.5px/1 var(--cond);letter-spacing:.06em;color:var(--faint);text-align:center}
.dpk button{border:1px solid var(--line);background:var(--surface);padding:4px 0 3px;font:700 12.5px/1.1 var(--cond);font-variant-numeric:tabular-nums;cursor:pointer;border-radius:2px;border-bottom:3px solid transparent}
.dpk button small{display:block;font:600 8.5px/1 var(--cond);letter-spacing:.04em;color:var(--muted)}
.dpk button.f-mont{border-bottom-color:var(--ph-mon)} .dpk button.f-ev{border-bottom-color:var(--orange)} .dpk button.f-desm{border-bottom-color:var(--ph-des)}

/* períodos extras do evento (2 finais de semana ou mais) */
.g2j{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:end}

/* descarregamentos: linhas editáveis */
.crono.desc{--ccols:minmax(150px,1.2fr) 112px minmax(170px,1.5fr) minmax(130px,1fr) 100px 64px 132px 66px}
.cr2.c2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}

/* calendário do mês */
.calw{min-width:820px}
.calh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px}
.calh span{font:700 10.5px/1.2 var(--cond);letter-spacing:.08em;color:var(--muted);text-align:center;text-transform:uppercase}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cald{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:98px;padding:5px 6px;border:1px solid var(--line);background:var(--surface);border-radius:2px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0}
.cald:hover{border-color:var(--navy)}

.cev{display:flex;align-items:center;gap:4px;border-left:3px solid var(--evc,var(--navy));background:color-mix(in srgb,var(--evc,var(--navy)) 14%,var(--surface));padding:1px 4px;font:700 10px/1.35 var(--cond);letter-spacing:.02em;text-transform:uppercase;min-width:0}
.cev b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.cev i{font-style:normal;color:var(--muted);letter-spacing:.08em;flex:none}
.cmais{font:600 9.5px/1.2 var(--cond);letter-spacing:.04em;color:var(--faint);text-transform:uppercase}
.ccnt{margin-top:auto;font:700 9.5px/1.3 var(--cond);letter-spacing:.04em;color:var(--teal);text-transform:uppercase}

/* modal simples */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.mcard{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);box-shadow:var(--shadow);padding:16px}

.mcard textarea{width:100%;min-height:280px;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--ink);font:500 13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:vertical}
.mcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-end}
.pdfc{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.pdfc .btn{justify-content:center;padding:11px 14px;font-size:13px}

/* prévia do pdf */
.pvwrap{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 55%,#1b2430)}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:2px solid var(--orange);box-shadow:var(--shadow)}
.pv-tt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 240px}
.pv-tt b{font:700 14.5px/1.2 var(--cond);letter-spacing:.03em;overflow-wrap:anywhere;color:var(--ink)}
.pv-tt small{font:600 11.5px/1.3 var(--cond);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.pv-body{flex:1;min-height:0;overflow:auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;overscroll-behavior:contain}
.pv-pg{width:min(100%,1000px);flex:0 0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.28);position:relative;overflow:hidden}

/* ===== cronograma de carregamento: linhas que editam direto ===== */
.crono{--ccols:104px minmax(170px,1.5fr) minmax(130px,1fr) minmax(130px,.95fr) 100px 64px 100px 64px 100px 64px minmax(130px,1fr) 132px 66px;border:1px solid var(--line);background:var(--surface)}
.crono.comev{--ccols:minmax(150px,1.2fr) 104px minmax(170px,1.5fr) minmax(130px,1fr) minmax(130px,.95fr) 100px 64px 100px 64px 100px 64px minmax(130px,1fr) 132px 66px}
.dgrp .crono{border-top:0}
.chead,.cr1{display:grid;grid-template-columns:var(--ccols);gap:6px;align-items:center}
.chead{padding:5px 8px 5px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font:700 10.5px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.crow.traz{background:color-mix(in srgb,var(--ph-des) 6%,var(--surface))}
.crow.cancel>.cr1,.crow.cancel>.cr2{opacity:.5}

@keyframes lnovo{0%{background:var(--orange-soft)}100%{background:transparent}}
.crow .c,.vrow .c{display:flex;flex-direction:column;gap:2px;min-width:0;margin:0}
.crow .cr1>.c>span:first-child,.vrow>.c>span:first-child{display:none;font:700 10px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crow input,.crow select,.crow textarea,.vrow input,.vrow select{width:100%;min-width:0;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);font:600 13px/1.25 var(--body);padding:5px 7px;text-transform:uppercase}
.crow input::placeholder,.crow textarea::placeholder,.vrow input::placeholder{text-transform:none;color:var(--faint);font-weight:500}
.crow input:hover,.crow select:hover,.crow textarea:hover,.vrow input:hover,.vrow select:hover{border-color:var(--line-strong)}
.crow input:focus,.crow select:focus,.crow textarea:focus,.vrow input:focus,.vrow select:focus{border-color:var(--focus);background:var(--surface);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 25%,transparent)}
.crow input:disabled,.crow select:disabled,.crow textarea:disabled,.vrow input:disabled,.vrow select:disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);resize:none}
.crow input.dt,.crow input.hr{font-variant-numeric:tabular-nums;text-align:center;padding-inline:3px}
.crow input.bad,.vrow input.bad{border-color:var(--danger);background:var(--danger-soft)}
.crow select.stsel{font:700 11.5px/1.2 var(--cond);letter-spacing:.05em;padding:6px 5px;max-width:none}
.crow .c-sent select,.crow .c-onde select{font:700 12px/1.2 var(--cond);letter-spacing:.06em}
.crow.traz .c-sent select{color:var(--ph-des)}
.pickwrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.pickwrap select{border-left:3px solid var(--navy)!important}
.pickwrap.outro input{border-left:3px solid var(--orange)}
.c-cam{gap:3px!important}
.pickwrap.cav select{border-left:3px solid var(--teal)!important;font-size:12px!important}
.vrow .c-cat select.sub{margin-top:3px;font-size:12px}
.c-act{flex-direction:row!important;gap:4px;justify-content:flex-end;align-items:center}
.ib{flex:none;width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;cursor:pointer;font:700 16px/1 var(--body);color:var(--muted);padding:0}
.ib:hover{border-color:var(--navy);color:var(--navy)}
.ib.x2:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.crow .cr2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.15fr) minmax(0,1fr);gap:6px;margin-top:6px}
.crow .cr2 .c>span{font:700 10px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crow textarea{display:block;resize:vertical;min-height:31px;max-height:240px;field-sizing:content;font-weight:500;line-height:1.3}

.cr3:hover{color:var(--navy);text-decoration:underline}
.crow .confirm{margin-top:6px}
.crow .av{margin-top:6px}
.addline{margin-top:8px}
.dh .spacer{flex:1}
.dh .btn.sm{padding:3px 9px;font-size:10.5px;align-self:center}
.dgrp.vazio{margin-bottom:6px}
.dgrp.vazio .dh{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ===== frota: cadastro ===== */
.box.fr-CAMINHAO{border-left-color:var(--orange)} .box.fr-EQUIP{border-left-color:var(--warn)} .box.fr-CARRO{border-left-color:var(--blue)}
.frhint{margin:-4px 0 2px}
.vlist{--vcols:minmax(150px,1.4fr) 100px minmax(120px,1fr) minmax(130px,1fr) minmax(170px,1.3fr) minmax(120px,1fr) 132px 34px;border:1px solid var(--line)}
.vhead,.vrow{display:grid;grid-template-columns:var(--vcols);gap:6px;align-items:start}
.vhead{padding:5px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);font:700 10.5px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ===== acessos (administrador) ===== */

.acrow{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:6px 10px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--surface)}

.acn small{display:block;font:500 11.5px/1.3 var(--body);color:var(--muted);overflow-wrap:anywhere}

.acrow select{width:100%;padding:5px 6px;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--ink);font:600 12px/1.2 var(--cond);letter-spacing:.04em;text-transform:uppercase}

.acnovo{border-top:1px solid var(--line);padding-top:12px}
.acnovo h3{margin:0 0 8px;font:700 13px/1.2 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.acg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0 10px}
.mcard .acinfo{font-size:12.5px;margin:10px 0 0}

/* painel: o que vai programar */

/* telas médias: a linha do caminhão quebra em duas */
@media (max-width:1640px){
  .chead,.vhead{display:none}
  .crow .cr1>.c>span:first-child,.vrow>.c>span:first-child{display:block}
  .cr1{grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
  .crono.comev .cr1>.c-ev{grid-column:span 3} .crono.comev .cr1>.c-sent{grid-column:span 2} .crono.comev .cr1>.c-cam{grid-column:span 4} .crono.comev .cr1>.c-mot{grid-column:span 3}
  .crono:not(.comev) .cr1>.c-sent{grid-column:span 2} .crono:not(.comev) .cr1>.c-cam{grid-column:span 5} .crono:not(.comev) .cr1>.c-mot{grid-column:span 5}
  .cr1>.c-onde{grid-column:span 3} .cr1>.c-dt{grid-column:span 2} .cr1>.c-hr{grid-column:span 1} .cr1>.c-dest{grid-column:span 7} .cr1>.c-st{grid-column:span 3} .cr1>.c-act{grid-column:span 2}
  .vrow{grid-template-columns:repeat(6,minmax(0,1fr));align-items:end}
  .vrow>.c-nome{grid-column:span 2} .vrow>.c-placa,.vrow>.c-mod{grid-column:span 1} .vrow>.c-mot{grid-column:span 2}
  .vrow>.c-dono,.vrow>.c-obs{grid-column:span 2} .vrow>.c-cat,.vrow>.c-act{grid-column:span 1}
  .vrow+.vrow{border-top:2px solid var(--line-strong)}
}
@media (max-width:760px){
  .cr1{grid-template-columns:repeat(6,minmax(0,1fr))}
  .crono.comev .cr1>.c-ev{grid-column:1/-1}
  .crono.comev .cr1>.c-sent,.crono:not(.comev) .cr1>.c-sent{grid-column:span 2}
  .crono.comev .cr1>.c-cam,.crono:not(.comev) .cr1>.c-cam{grid-column:span 4}
  .crono.comev .cr1>.c-mot,.crono:not(.comev) .cr1>.c-mot{grid-column:span 3}
  .crow input.hr{padding-inline:1px;font-size:12.5px}
  .cr1>.c-onde{grid-column:span 3} .cr1>.c-dt{grid-column:span 2} .cr1>.c-hr{grid-column:span 1} .cr1>.c-dest{grid-column:1/-1} .cr1>.c-st{grid-column:span 3} .cr1>.c-act{grid-column:1/-1}
  .crow .cr2{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vrow>.c-nome,.vrow>.c-mot,.vrow>.c-dono,.vrow>.c-obs{grid-column:1/-1} .vrow>.c-placa,.vrow>.c-mod,.vrow>.c-cat,.vrow>.c-act{grid-column:span 1}
  .acrow{grid-template-columns:minmax(0,1fr)} .aca{justify-content:flex-start} .acg{grid-template-columns:minmax(0,1fr)}
  .dh .btn.sm{margin-left:auto}
}
@media (max-width:440px){ .newg{grid-template-columns:minmax(0,1fr)} }
@media print{ .c-act,.addline,.dh .btn,.cr3{display:none} }

.box.alocs{border-left-color:var(--teal)}

<script>
'use strict';
/* =====================================================================
   LOGÍSTICA PLENART — caminhões, empilhadeiras e carros por evento
   · Sistema independente (projeto Supabase próprio). Tudo fica em "logistica", um documento por item:
     EVENTO (cadastrado aqui), VEICULO (frota), VIAGEM (caminhão do cronograma), EQUIP (empilhadeira
     no evento), CARRO (carro da equipe). Do Demandas só dá pra TRAZER eventos e frota de um backup (JSON).
   · ACESSO próprio: o administrador da Logística cria e libera (tabela logistica_acessos).
     O primeiro que entrar vira administrador.
   · No artifact da Claude: banco do próprio artifact (versão de teste, com cópia dos eventos).
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=v=>String(v==null?'':v).trim();
const normName=s=>String(s==null?'':s).toUpperCase().replace(/\s+/g,' ').trim();
/* texto de várias linhas (o que leva, o que traz, obs): maiúsculo, sem espaço sobrando, mantém as linhas */
const normArea=s=>String(s==null?'':s).toUpperCase().split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n');
const umaLinha=s=>normArea(s).split('\n').join(' / ');
const fold=s=>normName(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
const pad2=n=>String(n).padStart(2,'0');
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const num=v=>{ const n=Number(v); return isFinite(n)?n:0; };
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const newId=()=>'lg-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowIso=()=>new Date().toISOString();
const plural=(n,s,p)=>n+' '+(n===1?s:p);
const jclone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
const DIAS3=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const DIAS_L=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'];
const MESES_L=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const IN_CLAUDE=()=>!!(window.claude&&typeof window.claude.use==='function');

/* ===== datas ===== */
function parseISO(s){ if(!s||typeof s!=='string') return null; const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d; }
function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const addIso=(k,n)=>{ const d=parseISO(k); return d?iso(addDays(d,n)):''; };
function today0(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
const hoje=()=>iso(today0());
function fmtDM(k){ const d=parseISO(k); return d?pad2(d.getDate())+'/'+pad2(d.getMonth()+1):''; }
function fmtDMY(k){ const d=parseISO(k); return d?pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear():''; }
function fmtD(k){ const d=parseISO(k); if(!d) return ''; return DIAS3[d.getDay()]+' '+pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+(d.getFullYear()!==today0().getFullYear()?'/'+String(d.getFullYear()).slice(2):''); }
function fmtDL(k){ const d=parseISO(k); return d?DIAS_L[d.getDay()]+', '+fmtDMY(k):''; }
function periodoDM(a,b){ if(!a&&!b) return ''; const x=fmtDM(a||b), y=fmtDM(b||a); return x===y?x:x+' A '+y; }
function eachDay(a,b,fn){ let d=parseISO(a); const e=parseISO(b||a); if(!d||!e) return; let g=0; while(d<=e&&g<400){ fn(iso(d),d); d=addDays(d,1); g++; } }
function diasEntre(a,b){ const out=[]; if(!a&&!b) return out; let x=a||b, y=b||a; if(y<x){ const t=x; x=y; y=t; } eachDay(x,y,k=>out.push(k)); return out; }
function nDias(a,b){ const x=parseISO(a), y=parseISO(b); return x&&y?Math.round((y-x)/864e5):0; }
function weekStart(k){ const d=parseISO(k)||today0(); return iso(addDays(d,-((d.getDay()+6)%7))); }
const isWE=k=>{ const d=parseISO(k); return !!d&&(d.getDay()===0||d.getDay()===6); };
const isDom=k=>{ const d=parseISO(k); return !!d&&d.getDay()===0; };
/* lista curta de dias: 20/11, 22/11 A 25/11 */
function diasTxt(ds){ const ks=Array.from(new Set((ds||[]).filter(Boolean))).sort(); const out=[]; let a=null,b=null;
  ks.forEach(k=>{ if(b&&addIso(b,1)===k){ b=k; return; } if(a) out.push(periodoDM(a,b)); a=k; b=k; }); if(a) out.push(periodoDM(a,b));
  return out.length>4?out.slice(0,4).join(', ')+' E MAIS '+(out.length-4):out.join(', '); }
/* data digitada: 24/10, 24/10/26, 24/10/2026, 2410, 24-10 — completa o ano pelo contexto */
function parseDateText(txt,refIso){
  txt=String(txt||'').trim().replace(/^[A-Za-zÀ-ÿ]{3}\.?\s+/,''); if(!txt) return '';
  let m,d,mo,y=null;
  if((m=txt.match(/^(\d{4})-(\d{2})-(\d{2})$/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=txt.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/))){ d=+m[1]; mo=+m[2]; if(m[3]) y=m[3].length===2?2000+(+m[3]):+m[3]; }
  else if((m=txt.match(/^(\d{2})(\d{2})(\d{2}|\d{4})?$/))){ d=+m[1]; mo=+m[2]; if(m[3]) y=m[3].length===2?2000+(+m[3]):+m[3]; }
  else return null;
  if(!(d>=1&&d<=31&&mo>=1&&mo<=12)) return null;
  if(y==null){ const ref=parseISO(refIso)||today0(); y=ref.getFullYear(); const cand=new Date(y,mo-1,d); if(cand<addDays(ref,-120)) y++; else if(cand>addDays(ref,300)) y--; }
  const dt=new Date(y,mo-1,d); if(dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return iso(dt);
}
/* hora digitada: 5, 530, 0530, 5:30, 5h, 5h30, 14 */
function parseHora(txt){
  txt=String(txt||'').trim().toLowerCase().replace(/\s+/g,''); if(!txt) return '';
  let m,h,mi;
  if((m=txt.match(/^(\d{1,2})(?:[:h.](\d{1,2}))?(?:h|hs|min)?$/))){ h=+m[1]; mi=m[2]!=null?+m[2]:0; if(m[2]&&m[2].length===1) mi*=10; }
  else if((m=txt.match(/^(\d{3,4})$/))){ const s=m[1].padStart(4,'0'); h=+s.slice(0,2); mi=+s.slice(2); }
  else return null;
  if(h>23||mi>59) return null;
  return pad2(h)+':'+pad2(mi);
}
const dtk=(d,h)=>(d||'9999-99-99')+' '+(h||'99:99');
function horaAgora(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }

/* ===== estado ===== */
let eventos=[], ambientes=[], recursos=[], itens=[], META={};
let REC=new Map(), EVM=new Map();
let storage='connecting'; /* db (artifact) · sb (site) · local · login · error */
let db=null, sb=null, ME=null, AUTH=null, readOnly=false, semTabela=false;
let ACESSOS=[], MODAL=''; /* lista de acessos (só o administrador vê) · janela aberta */
const loaded={eventos:false,ambientes:false,recursos:false,logistica:false};
const LSK={ui:'plenart.logistica.ui',itens:'plenart.logistica.itens',dem:'plenart.logistica.demandas',bk:'plenart.logistica.backupEm',tema:'plenart.ui.tema'};
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const UI0={view:'eventos',evf:'proximos',q:'',cal:{mes:''},car:{modo:'dia',dia:'',vista:'car',ev:'',onde:''},sai:{modo:'dia',dia:'',ev:'',tipos:{CAMINHAO:true,CARRO:true,EQUIP:true}},fro:{ini:'',prev:true,cad:false},prod:{modo:'semana',dia:'',ev:'',cad:false},eqp:{modo:'semana',dia:'',ev:'',cad:false}};
const UI=(()=>{ const s=lsGet(LSK.ui)||{}, o=jclone(UI0);
  ['evf'].forEach(k=>{ if(typeof s[k]==='string') o[k]=s[k]; });
  if(isObj(s.car)){ if(s.car.modo==='semana'||s.car.modo==='mes') o.car.modo=s.car.modo; o.car.vista=['car','des','quadro'].indexOf(s.car.vista)>=0?s.car.vista:(s.car.quadro?'quadro':'car'); }
  if(isObj(s.sai)){ if(s.sai.modo==='semana') o.sai.modo='semana'; if(isObj(s.sai.tipos)) Object.assign(o.sai.tipos,s.sai.tipos); }
  if(isObj(s.fro)){ o.fro.prev=s.fro.prev!==false; o.fro.cad=!!s.fro.cad; }
  ['prod','eqp'].forEach(k=>{ if(isObj(s[k])){ if(['dia','semana','mes'].indexOf(s[k].modo)>=0) o[k].modo=s[k].modo; o[k].cad=!!s[k].cad; } });
  if(isObj(s.cal)&&isObj(s.cal.f)) o.cal.f=s.cal.f;
  return o; })();
function saveUI(){ lsSet(LSK.ui,{evf:UI.evf,car:{modo:UI.car.modo,vista:UI.car.vista},sai:{modo:UI.sai.modo,tipos:UI.sai.tipos},fro:{prev:UI.fro.prev,cad:UI.fro.cad},prod:{modo:UI.prod.modo,cad:UI.prod.cad},eqp:{modo:UI.eqp.modo,cad:UI.eqp.cad},cal:{f:UI.cal.f||{}}}); }
const uiP=k=>({car:UI.car,sai:UI.sai,prod:UI.prod,eqp:UI.eqp})[k]||UI.car;
let view='eventos', currentEv=null;
const VIEWS=['eventos','calendario','carregamentos','saidas','producao','equipes','frota'];

/* ===== juntar o que eu mudei com o que está no banco (várias pessoas ao mesmo tempo) ===== */
function stab(o){ if(Array.isArray(o)) return '['+o.map(stab).join(',')+']'; if(o&&typeof o==='object') return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stab(o[k])).join(',')+'}'; return JSON.stringify(o===undefined?null:o); }
const same=(a,b)=>stab(a)===stab(b);
const isIdList=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null);
const isPrimList=v=>Array.isArray(v)&&v.every(x=>x==null||typeof x!=='object');
function merge3(base,local,server){
  if(base===undefined){ if(local===undefined) return server; if(server===undefined||same(local,server)) return local;
    if(Array.isArray(local)&&Array.isArray(server)) base=[]; else if(isObj(local)&&isObj(server)) base={}; else return local; }
  if(same(local,base)) return server;
  if(same(server,base)) return local;
  if(local===undefined) return server;
  if(server===undefined) return local;
  if(Array.isArray(base)||Array.isArray(local)||Array.isArray(server)){
    const B=Array.isArray(base)?base:[], L=Array.isArray(local)?local:[], S=Array.isArray(server)?server:[];
    if(isIdList(B)&&isIdList(L)&&isIdList(S)) return mergeIdList(B,L,S);
    if(isPrimList(B)&&isPrimList(L)&&isPrimList(S)) return mergePrimList(B,L,S);
    return local;
  }
  if(isObj(base)&&isObj(local)&&isObj(server)){ const out={}; new Set(Object.keys(base).concat(Object.keys(local),Object.keys(server))).forEach(k=>{ const r=merge3(base[k],local[k],server[k]); if(r!==undefined) out[k]=r; }); return out; }
  return local;
}
function mergeIdList(B,L,S){
  const bm=new Map(B.map(x=>[x.id,x])), lm=new Map(L.map(x=>[x.id,x])), sm=new Map(S.map(x=>[x.id,x])), out=[];
  S.forEach(s=>{ const b=bm.get(s.id), l=lm.get(s.id); if(b&&!l){ if(same(s,b)) return; out.push(s); return; } if(b&&l){ out.push(merge3(b,l,s)); return; } out.push(l||s); });
  L.forEach(l=>{ if(!bm.has(l.id)&&!sm.has(l.id)) out.push(l); });
  return out;
}
function mergePrimList(B,L,S){ const rem=B.filter(x=>L.indexOf(x)<0), add=L.filter(x=>B.indexOf(x)<0); const out=S.filter(x=>rem.indexOf(x)<0); add.forEach(x=>{ if(out.indexOf(x)<0) out.push(x); }); return out; }
function blankOf(o){ if(Array.isArray(o)) return []; if(o&&typeof o==='object'){ const b={}; Object.keys(o).forEach(k=>{ const v=o[k]; if(v&&typeof v==='object') b[k]=blankOf(v); }); return b; } return undefined; }

/* ===== dados do Demandas (só leitura) ===== */
function normEv(e){ const o=Object.assign({},e); ['produtores','equipes','fretes'].forEach(k=>{ o[k]=Array.isArray(o[k])?o[k].filter(isObj):[]; }); ['dias','parcial','diasManut'].forEach(k=>{ if(!isObj(o[k])) o[k]={}; }); return o; }
function normAmb(a){ const o=Object.assign({},a); o.equip=Array.isArray(o.equip)?o.equip.filter(isObj):[]; o.itens=Array.isArray(o.itens)?o.itens.filter(isObj):[]; return o; }
function normRec(r){ const o=Object.assign({tipo:'EQUIPE',nome:''},r); if(['EQUIPAMENTO','PRODUTOR','VEICULO','PESSOA'].indexOf(o.tipo)<0) o.tipo='EQUIPE'; return o; }
function setCol(col,list){
  if(col==='eventos'){ eventos=list.map(normEv); EVM=new Map(eventos.map(e=>[e.id,e])); }
  else if(col==='ambientes') ambientes=list.map(normAmb);
  else if(col==='recursos'){ recursos=list.map(normRec); REC=new Map(recursos.map(r=>[r.id,r])); }
}
const evById=id=>EVM.get(id)||null;
const regOf=id=>id?(REC.get(id)||null):null;
const evAtivo=e=>!!e&&!e.concluido;
function evsAtivos(){ return eventos.filter(evAtivo); }
function recsOf(tipo){ return recursos.filter(r=>r.tipo===tipo&&tr(r.nome)).sort((a,b)=>(num(a.ordem)-num(b.ordem))||String(a.nome).localeCompare(String(b.nome))); }
function ambsOf(evId){ return (IX&&IX.amb.get(evId))||ambientes.filter(a=>a.eventoId===evId); }
const isGeral=a=>!!a&&(a.geral===true||(!!a.eventoId&&a.id==='g-'+a.eventoId));
/* ===== frota da Logística (cadastro próprio: caminhões, empilhadeiras / equipamentos, carros) ===== */
const FR_CAT=['CAMINHAO','EQUIP','CARRO'];
const FR_LBL={CAMINHAO:'CAMINHÃO',EQUIP:'EMPILHADEIRA / EQUIPAMENTO',CARRO:'CARRO'};
function frotaDocs(){ return itens.filter(x=>x.tipo==='VEICULO'); }
/* veículo da frota pelo id daqui — ou pelo id do cadastro do Demandas (programação antiga, de antes de trazer a frota) */
function veic(id){ if(!id) return null; if(IX&&IX.vei){ const v=IX.vei.get(id); if(v) return v; } return itens.find(x=>x.tipo==='VEICULO'&&(x.id===id||x.demId===id))||null; }
const frOrd=(a,b)=>(num(a.ordem)-num(b.ordem))||String(a.nome).localeCompare(String(b.nome));
function frotaCat(cat){ return frotaDocs().filter(v=>v.cat===cat).sort(frOrd); }
const isEmp=r=>/EMPILHAD/.test(fold(r&&r.nome));
function caminhoesCad(){ return frotaCat('CAMINHAO').concat(frotaCat('EQUIP').filter(e=>e.caminhao)); }
function carrosCad(){ return frotaCat('CARRO'); }
function equipCad(){ return frotaCat('EQUIP').sort((a,b)=>(isEmp(a)?0:1)-(isEmp(b)?0:1)||frOrd(a,b)); }
const isAgregado=r=>!!r&&r.dono==='AGREGADO';
function placaDe(r){ const p=normName(r&&r.placa).replace(/[^A-Z0-9]/g,''); if(p) return p; const m=normName(r&&r.nome).match(/\b([A-Z]{3})-?(\d[A-Z0-9]\d{2})\b/); return m?m[1]+m[2]:''; }
function vehName(r){ if(!r) return ''; const n=normName(r.nome)||'VEÍCULO', p=placaDe(r); return p&&n.replace(/[^A-Z0-9]/g,'').indexOf(p)<0?n+' '+p:n; }
/* carreta (precisa de cavalo) / cavalo mecânico: o que foi marcado na frota, senão pelo nome */
const RX_CARRETA=/CARRETA|REBOQUE|PRANCHA|SIDER|BITREM|RODOTREM/;
function ehCarreta(r){ if(!r||r.cat!=='CAMINHAO') return false; if(r.sub) return r.sub==='CARRETA'; return RX_CARRETA.test(normName(r.nome)+' '+normName(r.modelo)); }
function ehCavalo(r){ if(!r||r.cat!=='CAMINHAO') return false; if(r.sub) return r.sub==='CAVALO'; return /CAVALO/.test(normName(r.nome)+' '+normName(r.modelo)); }
function condutorDe(r){ return r?normName(r.motorista||r.condutor):''; }
function vehSpec(r){ return r?[tr(r.modelo),tr(r.cap)].filter(Boolean).map(normName).join(' · '):''; }
/* nome digitado que é de um veículo do cadastro (pelo nome ou pela placa) */
function porNome(txt){ const f=fold(txt); if(!f) return null; const so=f.replace(/[^A-Z0-9]/g,''); return frotaDocs().find(v=>fold(v.nome)===f||fold(vehName(v))===f||(placaDe(v).length>=7&&so.indexOf(placaDe(v))>=0))||null; }
function chaveNome(txt){ const v=porNome(txt); return v?'r:'+v.id:(tr(txt)?'t:'+fold(txt):''); }
/* veículo do cadastro do Demandas -> o mesmo veículo da frota daqui (trazido pelo botão, pela placa ou pelo nome) */
function doDemandas(rec){ if(!rec) return null; const fr=frotaDocs(); const by=fr.find(v=>v.demId===rec.id); if(by) return by; const p=placaDe(rec); if(p){ const x=fr.find(v=>placaDe(v)===p); if(x) return x; } const n=fold(rec.nome); return fr.find(v=>fold(v.nome)===n)||null; }
function demCondutor(r){ if(!r) return ''; if(tr(r.condutor)) return normName(r.condutor); if(tr(r.motorista)) return normName(r.motorista); if(r.tipo==='VEICULO'){ const t=recursos.find(x=>x.tipo==='EQUIPE'&&x.veiculoId===r.id&&tr(x.motorista)); if(t) return normName(t.motorista); } return ''; }
const PHK={mont:['monInicio','monFim'],ev:['evInicio','evFim'],desm:['desInicio','desFim']};
const PHN={mont:'MONTAGEM',ev:'EVENTO',desm:'DESMONTAGEM'};
function janelas(ev,k){ const [ka,kb]=PHK[k], out=[]; if(ev[ka]||ev[kb]) out.push({a:ev[ka]||ev[kb],b:ev[kb]||ev[ka]}); const j=isObj(ev.janelas)&&Array.isArray(ev.janelas[k])?ev.janelas[k]:[]; j.forEach(x=>{ if(x&&(x.a||x.b)) out.push({a:x.a||x.b,b:x.b||x.a}); }); out.forEach(x=>{ if(x.b<x.a){ const t=x.a; x.a=x.b; x.b=t; } }); return out.filter(x=>ISO_RE.test(x.a)&&ISO_RE.test(x.b)).sort((x,y)=>x.a<y.a?-1:x.a>y.a?1:0); }
function fmtJan(ev,k){ return janelas(ev,k).map(x=>periodoDM(x.a,x.b)).join(' · '); }
function evPer(ev){

  const U=IX.uso;
  const add=(key,day,e)=>{ if(!key||!day) return; let m=U.get(key); if(!m){ m=new Map(); U.set(key,m); } let a=m.get(day); if(!a){ a=[]; m.set(day,a); } a.push(e); };
  itens.forEach(it=>{ if(!ehTrab(it)) return; const ev=evById(it.eventoId); if(!evAtivo(ev)||cancelado(it)) return;
    if(it.tipo==='VIAGEM'){ const k=truckKey(it), mk=motKey(it), nm=truckNome(it); const acts={}; const pa=(d,a)=>{ if(d) (acts[d]=acts[d]||[]).push(a); };
      pa(it.carData,'C'); pa(it.saiData,'S'); pa(it.cheData,'E'); pa(it.sevData,'X'); pa(it.volData,'V');
      const ck=cavaloKey(it), cn=cavaloNome(it);
      tripDias(it).forEach(d=>{ const a=acts[d]||['T'], hh=d===it.saiData?it.saiHora:d===it.carData?it.carHora:''; add(k,d,{ev:ev,it:it,act:a,hora:hh,g:'CAM',nm:nm}); if(ck&&ck!==k) add(ck,d,{ev:ev,it:it,act:a,hora:hh,g:'CAM',nm:cn}); add(mk,d,{ev:ev,it:it,act:a,g:'MOT',nm:normName(it.motorista)}); });
      if(it.carData){ const ek=empKey(it); if(ek) add(ek,it.carData,{ev:ev,it:it,act:['C'],load:true,local:it.carLocal,localNome:it.carLocalNome,hora:it.carHora,g:'EQ',nm:empNome(it)}); }
    } else if(it.tipo==='EQUIP'){ const k=equipKey(it), ds=eqDias(it), nm=equipNome(it); ds.forEach((d,i)=>add(k,d,{ev:ev,it:it,act:['A'],aloc:true,first:i===0,last:i===ds.length-1,g:'EQ',nm:nm})); }
    else { const k=carroKey(it), mk=motKey(it), nm=carroNome(it); it.dias.forEach(d=>{ add(k,d,{ev:ev,it:it,act:['S'],hora:it.hora,g:'CAR',nm:nm}); add(mk,d,{ev:ev,it:it,act:['S'],g:'MOT',nm:normName(it.motorista)}); }); }
  });
  /* previsto no Demandas e ainda não programado aqui (só o que é do cadastro: dá pra saber qual é) */
  evsAtivos().forEach(ev=>{ const p=previsto(ev);
    p.equip.forEach(x=>{ if(x.link.length||!x.nossa) return; const k=x.r?'r:'+x.r.id:chaveNome(x.nome); if(!k) return; const ds=diasEntre(x.q.de||x.q.ate,x.q.ate||x.q.de); if(ds.length>370) return; ds.forEach((d,i)=>add(k,d,{ev:ev,prev:true,act:['A'],aloc:true,first:i===0,last:i===ds.length-1,src:x,g:(x.r?x.r.caminhao:(x.dem&&x.dem.caminhao))?'CAM':'EQ',nm:x.nome})); });
    p.fretes.forEach(x=>{ if(x.leva.length||x.traz.length||!(x.v||x.dem)) return; const k=x.v?'r:'+x.v.id:chaveNome(x.nome); [x.f.ida,x.f.volta].filter(d=>ISO_RE.test(d)).forEach(d=>add(k,d,{ev:ev,prev:true,act:['P'],src:x,g:'CAM',nm:x.nome})); });
    p.carros.forEach(x=>{ if(x.link.length||!x.veic) return; const k=x.own?'r:'+x.own.id:chaveNome(vehName(x.veic)); x.dias.forEach(d=>add(k,d,{ev:ev,prev:true,act:['S'],src:x,g:'CAR',nm:x.own?vehName(x.own):vehName(x.veic)})); });
  });
}
/* choque num dia: 'bad' = impossível (empilhadeira em dois lugares) · 'warn' = conferir (caminhão/carro/motorista em 2 eventos) */
function choqueDia(key,day,semPrev){
  const m=IX.uso.get(key); let arr=m?(m.get(day)||[]):[]; if(semPrev) arr=arr.filter(e=>!e.prev); if(arr.length<2) return null;
  const alocs=arr.filter(e=>e.aloc), loads=arr.filter(e=>e.load), outros=arr.filter(e=>!e.aloc&&!e.load);
  if(alocs.length||loads.length){
    /* empilhadeira / equipamento: o que vale é o LUGAR (no evento X, no galpão) — o mesmo evento também conta */
    let bad=false, warn=false;
    const aEv=new Set(alocs.map(e=>e.ev.id)), aProg=new Set(alocs.filter(e=>!e.prev).map(e=>e.ev.id));
    if(aEv.size>=2){ const meio=alocs.some(e=>!e.first&&!e.last); if(aProg.size>=2&&meio) bad=true; else warn=true; }
    loads.forEach(l=>{ const lugar=lugarCar(l.local,l.localNome,l.ev); alocs.forEach(a=>{ if(lugar===a.ev.id) return; if(a.prev||a.first||a.last) warn=true; else bad=true; }); });
    const sites=new Set(loads.map(l=>lugarCar(l.local,l.localNome,l.ev))); if(sites.size>=2) warn=true;
    if(outros.length){ const oEv=new Set(outros.map(e=>e.ev.id)); if(oEv.size>=2||Array.from(oEv).some(id=>aEv.size&&!aEv.has(id))) warn=true; }
    return bad?'bad':warn?'warn':null;
  }
  if(new Set(arr.map(e=>e.ev.id)).size<2) return null;
  return 'warn';
}
function chavesDo(it){

  if(it.tipo==='EQUIP') return [[equipKey(it),'O EQUIPAMENTO',eqDias(it)]];

}

    if(it.cheData&&it.saiData&&it.cheData<it.saiData) out.push({sev:'warn',txt:'A CHEGADA ESTÁ ANTES DA SAÍDA'});
    if(it.sevData&&it.cheData&&it.sevData<it.cheData) out.push({sev:'warn',txt:'A SAÍDA DO EVENTO ESTÁ ANTES DA CHEGADA'});
    if(it.sevData&&it.saiData&&it.sevData<it.saiData) out.push({sev:'warn',txt:'A SAÍDA DO EVENTO ESTÁ ANTES DA SAÍDA DO GALPÃO'});

const BASE=new Map(); const SAVE=new Map();
const pendente=id=>SAVE.has(id);
function upsertLocal(o){ const i=itens.findIndex(x=>x.id===o.id); if(i>=0) itens[i]=o; else itens.push(o); }
function removeLocal(id){ itens=itens.filter(x=>x.id!==id); }
function chegouLogistica(list){
  const by=new Map(itens.map(x=>[x.id,x])), srv=new Set(list.map(s=>s.id)), out=[];
  list.forEach(s=>{ const l=by.get(s.id); if(l&&pendente(s.id)){ const b=BASE.get(s.id); out.push(b?normItem(merge3(b,l,s)):l); return; } BASE.set(s.id,jclone(s)); out.push(s); });
  itens.forEach(l=>{ if(!srv.has(l.id)&&pendente(l.id)&&!BASE.has(l.id)) out.push(l); });
  Array.from(BASE.keys()).forEach(id=>{ if(!srv.has(id)&&!pendente(id)) BASE.delete(id); });
  itens=out;
}
function setSaveTxt(st){ const el=$('#saveTxt'); if(!el) return; el.className=st==='ok'?'ok':st==='erro'?'bad':''; el.textContent=st==='salvando'?'· SALVANDO…':st==='ok'?'· SALVO':st==='erro'?'· NÃO SALVOU':''; const pi=$('#pSave'); if(pi){ pi.className='si'+(st==='ok'?' ok':st==='erro'?' bad':''); pi.textContent=st==='salvando'?'SALVANDO…':st==='ok'?'SALVO':st==='erro'?'NÃO SALVOU — TENTE DE NOVO':''; } clearTimeout(setSaveTxt.t); if(st==='ok') setSaveTxt.t=setTimeout(()=>{ if(el.textContent==='· SALVO') el.textContent=''; },2500); }
function agendar(id,ms){ let st=SAVE.get(id); if(!st){ st={t:0,run:null,again:false}; SAVE.set(id,st); } clearTimeout(st.t); st.t=setTimeout(()=>{ st.t=0; salvarAgora(id); },ms==null?400:ms); }
async function salvarAgora(id){
  let st=SAVE.get(id); if(!st){ st={t:0,run:null,again:false}; SAVE.set(id,st); } clearTimeout(st.t); st.t=0;
  if(st.run){ st.again=true; return st.run; }
  const it=itens.find(x=>x.id===id); if(!it){ SAVE.delete(id); return; }
  setSaveTxt('salvando');
  st.run=(async()=>{
    try{ const out=await gravar(jclone(it));
      if(out===null){ removeLocal(id); BASE.delete(id); toast('Esse item foi excluído por outra pessoa.',true); if(PANEL.id===id) fecharPanel(); }
      else if(out){ const cur=itens.find(x=>x.id===id); if(cur&&!same(out,it)) upsertLocal(normItem(same(cur,it)?out:merge3(it,cur,out))); }
      setSaveTxt('ok');
    }catch(err){ setSaveTxt('erro'); erroGravar(err); }

  })();

function resolver(base,obj,srv,lido){
  if(base&&lido&&!srv) return null;
  if(!base) return srv?merge3(blankOf(srv),obj,srv):obj;
  if(!srv||same(srv,base)) return obj;
  return merge3(base,obj,srv);
}
const corpo=o=>{ const b=Object.assign({},o); delete b.id; return b; };
let SB_COND=true;
const sbRede=e=>!!e&&/fetch|network|timeout/i.test(String(e.message||''));
const sbDup=e=>!!e&&(e.code==='23505'||/duplicate key|already exists/i.test(String(e.message||'')));
async function sbTry(fn){ let r=await fn(); if(r.error&&sbRede(r.error)){ await sleep(500+Math.random()*500); r=await fn(); } return r; }
async function gravar(obj){
  const id=obj.id, base=BASE.get(id);
  if(readOnly) throw {code:'readonly'};
  if(storage==='db'){
    const ref=db.collection('logistica').doc(id); let srv=null, lido=false;
    try{ const s=await ref.get(); srv=s&&s.exists?normItem(Object.assign({id:id},s.data())):null; lido=true; }catch(e){}
    const out=resolver(base,obj,srv,lido); if(out===null) return null;
    try{ await ref.set(corpo(out)); }catch(err){ if(err&&err.code==='unavailable'){ await sleep(400+Math.random()*400); await ref.set(corpo(out)); } else throw err; }
    BASE.set(id,jclone(out)); return out;
  }
  if(storage==='sb'){
    for(let tent=0;;tent++){
      let row=null, lido=false;
      try{ const q=await sb.from('logistica').select('id,data,updated_at').eq('id',id).maybeSingle(); if(q.error) throw q.error; row=q.data||null; lido=true; }catch(e){ if(!sbRede(e)) throw e; }
      const srv=row?normItem(Object.assign({id:id},row.data||{})):null;
      const out=resolver(base,obj,srv,lido); if(out===null) return null;
      let ts=new Date().toISOString(); if(row&&ts===row.updated_at) ts=new Date(Date.now()+1).toISOString();

      if(cond&&row&&row.updated_at){
        r=await sbTry(()=>sb.from('logistica').update({data:corpo(out),updated_at:ts}).eq('id',id).eq('updated_at',row.updated_at).select('id'));
        if(r.error&&!sbRede(r.error)) throw r.error;
        if(!r.error&&!(r.data&&r.data.length)){ await sleep(40+Math.random()*90*(tent+1)); if(tent>5) SB_COND=false; continue; }
      }else if(cond&&!row){
        r=await sbTry(()=>sb.from('logistica').insert({id:id,data:corpo(out),updated_at:ts}));
        if(r.error&&sbDup(r.error)){ await sleep(40+Math.random()*90); continue; }
      }else r=await sbTry(()=>sb.from('logistica').upsert({id:id,data:corpo(out),updated_at:ts}));
      if(r.error) throw r.error;
      BASE.set(id,jclone(out)); return out;
    }
  }
  if(storage==='local'){ lsSet(LSK.itens,itens); BASE.set(id,jclone(obj)); return obj; }
  throw {code:'connecting'};
}
async function apagar(id){
  if(readOnly) throw {code:'readonly'};
  /* espera a gravação que estiver no meio (senão ela traz o item de volta) */
  const st=SAVE.get(id); if(st){ clearTimeout(st.t); st.t=0; st.again=false; if(st.run){ try{ await st.run; }catch(e){} } }
  if(storage==='db') await db.collection('logistica').doc(id).delete();
  else if(storage==='sb'){ const r=await sb.from('logistica').delete().eq('id',id); if(r.error) throw r.error; }
  else if(storage==='local'){ removeLocal(id); lsSet(LSK.itens,itens); }
  else throw {code:'connecting'};
  removeLocal(id); BASE.delete(id); SAVE.delete(id);
}
const faltaTabela=e=>{ const m=String((e&&(e.message||e.details))||''); return !!e&&(e.code==='42P01'||e.code==='PGRST205'||/logistica/i.test(m)&&/does not exist|schema cache|could not find/i.test(m)); };
function erroGravar(err){
  const c=err&&err.code, m=String((err&&err.message)||'');
  if(c==='connecting'){ toast('Ainda conectando ao banco. Tente de novo em um segundo.',true); return; }
  if(c==='readonly'){ toast('Nesta tela dá só pra ver.',true); return; }
  if(c==='not_granted'||c==='not_writer'||c==='invalid_argument'||c==='42501'||/row-level security|permission/i.test(m)){ readOnly=true; setBanner(storage==='sb'?'VOCÊ NÃO TEM PERMISSÃO PRA SALVAR. PEÇA PRO ADMINISTRADOR DA LOGÍSTICA LIBERAR A EDIÇÃO.':'VOCÊ NÃO TEM PERMISSÃO PRA SALVAR AQUI. PEÇA ACESSO DE EDIÇÃO AO DONO DA PÁGINA.'); toast('Sem permissão pra salvar.',true); refresh(); return; }
  if(faltaTabela(err)){ semTabela=true; readOnly=true; setBanner(SQL_AVISO); refresh(); return; }
  if(c==='quota_exceeded'){ toast('Limite do banco atingido.',true); return; }

}

/* redesenha a tela sem atrapalhar quem está digitando ou clicando:
   · campo de texto com o cursor -> espera sair do campo
   · botão do mouse apertado -> espera soltar (senão o clique se perde)
   · lista de escolha / caixinha que acabou de mudar (force) -> redesenha e devolve o foco pro mesmo lugar */
function drawMain(force){
  const main=$('#main'), a=document.activeElement, dentro=!!(a&&a!==main&&main.contains(a));
  const campo=dentro&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.dataset.keep;
  const escolha=campo&&(a.tagName==='SELECT'||a.type==='checkbox');
  if(PTR||(campo&&!(force&&escolha))){ pendMain=true; return false; }
  pendMain=false;
  const sel=dentro?focoMain(a):'', vivo=dentro&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))?{v:a.value,s:a.selectionStart,e:a.selectionEnd,tag:a.tagName}:null;
  const sx=window.scrollX, sy=window.scrollY;
  main.innerHTML=viewHTML();
  autosize(main);
  if(FOCO){ const f=FOCO, r=main.querySelector('[data-row="'+cssq(f.id)+'"]');
    if(r){ FOCO=null; const el=(f.sel&&r.querySelector(f.sel+':not([disabled])'))||r.querySelector('select:not([disabled]),input:not([disabled])');
      r.classList.add('novo'); setTimeout(()=>r.classList.remove('novo'),1800);
      const bb=r.getBoundingClientRect(); if(bb.top<60||bb.bottom>window.innerHeight-20) r.scrollIntoView({block:'center'});
      if(el) try{ el.focus({preventScroll:true}); }catch(e){} return true; } }
  if(sel){ let el=null; try{ el=main.querySelector(sel); }catch(e){} if(el){ if(vivo&&el.tagName===vivo.tag&&el.value!==vivo.v) el.value=vivo.v; try{ el.focus({preventScroll:true}); if(vivo&&el.setSelectionRange) el.setSelectionRange(vivo.s,vivo.e); }catch(e){} } }
  if(window.scrollX!==sx||window.scrollY!==sy) window.scrollTo(sx,sy);
  return true;
}
/* como achar de novo o mesmo campo depois de redesenhar */
function focoMain(a){ if(!a||!a.dataset) return ''; if(a.dataset.keep) return '[data-keep="'+cssq(a.dataset.keep)+'"]';
  let s=''; for(const k of ['f','pick','act','cel','pday','pn','pm','evf','fn','fm','cq','stp','goday','kmv','gcad','calf']){ const v=a.dataset[k]; if(v!=null){ s='[data-'+k+'="'+cssq(v)+'"]'; break; } }
  if(!s) return a.id?'#'+cssq(a.id):'';
  ['dia','ev','cat','k','d','v'].forEach(k=>{ if(a.dataset[k]!=null&&s.indexOf('[data-'+k+'=')!==0) s+='[data-'+k+'="'+cssq(a.dataset[k])+'"]'; });
  const r=a.closest('[data-row]'); return r?'[data-row="'+cssq(r.dataset.row)+'"] '+s:s; }

/* ---------- lista de eventos (cartões agrupados: acontecendo agora · próximos) ---------- */
function proximaAcao(evId){
  const t=hoje(); let best=null; const pega=(d,h,txt)=>{ if(!d||d<t) return; const k=dtk(d,h); if(!best||k<best.k) best={k:k,d:d,h:h,txt:txt}; };
  itensDo(evId).forEach(it=>{ if(cancelado(it)) return;
    if(it.tipo==='VIAGEM'){ if(['PROGRAMADO','CARREGANDO'].indexOf(it.status)>=0) pega(it.carData,it.carHora,'CARREGA'); if(FLUXO[it.sentido].indexOf(it.status)<FLUXO[it.sentido].indexOf('SAIU')) pega(it.saiData,it.saiHora,'SAI'); }
    else if(it.tipo==='EQUIP'){ if(it.status==='PROGRAMADA') pega(it.de,it.vaiHora,'EQUIP. VAI'); }
    else it.dias.forEach(d=>pega(d,it.hora,'CARRO')); });
  return best;
}
/* o que o evento está fazendo HOJE (se montagem e desmontagem caem no mesmo dia, vale a etapa mais adiantada) */
function faseHoje(ev){ const t=hoje(); let f=''; ['mont','ev','desm'].forEach(k=>{ if(janelas(ev,k).some(x=>t>=x.a&&t<=x.b)) f=k; }); return f; }
function gruposEventos(){
  const q=fold(UI.q), t=hoje();
  let l=eventos.filter(e=>UI.evf==='arquivados'?e.concluido:!e.concluido);
  if(q) l=l.filter(e=>fold((e.nome||'')+' '+(e.local||'')+' '+(e.contato||'')).indexOf(q)>=0);
  const ini=e=>{ const p=evPer(e); return p?p.a:'9999'; };
  const asc=(a,b)=>ini(a)<ini(b)?-1:ini(a)>ini(b)?1:String(a.nome||'').localeCompare(String(b.nome||''));
  if(UI.evf==='arquivados') return [['ARQUIVADOS',l.sort(asc)]];
  const ag=[],px=[],pa=[],sd=[];
  l.forEach(e=>{ const p=evPer(e); if(!p) sd.push(e); else if(p.a<=t&&t<=p.b) ag.push(e); else if(p.a>t) px.push(e); else pa.push(e); });
  const rec=UI.evf==='todos'?pa:pa.filter(e=>{ const p=evPer(e); return p.b>=addIso(t,-3)||itensDo(e.id).some(it=>ultimaData(it)>=t); });
  const G=[['ACONTECENDO AGORA',ag.sort(asc)],['PRÓXIMOS',px.sort(asc)]];
  if(sd.length) G.push(['SEM DATAS',sd.sort(asc)]);
  if(rec.length) G.push([UI.evf==='todos'?'JÁ PASSARAM':'TERMINARAM HÁ POUCO',rec.sort((a,b)=>asc(b,a))]);
  return G;
}

const mesTxt=k=>MESES_L[+k.slice(5,7)-1]+' '+k.slice(0,4);
const perQual=per=>per.modo==='mes'?'nesse mês':per.modo==='semana'?'nessa semana':'nesse dia';
function perTxt(per){ if(per.modo==='mes') return 'MÊS DE '+mesTxt(per.a); return per.a===per.b?fmtDL(per.a):'SEMANA DE '+fmtDM(per.a)+' A '+fmtDMY(per.b); }

/* ---------- carregamentos e descarregamentos ---------- */
const evOk=it=>!it.eventoId||!!evById(it.eventoId);
/* descarregamento: LEVA descarrega no EVENTO quando chega (cheData) · BUSCA descarrega no GALPÃO quando volta (volData) */
const desData=it=>it.sentido==='TRAZ'?it.volData:it.cheData;
const desHora=it=>it.sentido==='TRAZ'?it.volHora:it.cheHora;
const desNoGalpao=it=>it.sentido==='TRAZ';
const desCarga=it=>it.sentido==='TRAZ'?it.traz:it.leva;
/* filtro "onde": carregamento = GALPÃO (nosso) / OUTRO (outra empresa) / EVENTO · descarregamento = GALPÃO / EVENTO (outra empresa não descarrega) */
const ondeCar=(it,f)=>!f.onde||it.carLocal===f.onde;
const ondeDes=(it,f)=>f.onde==='GALPÃO'?desNoGalpao(it):f.onde==='EVENTO'?!desNoGalpao(it):f.onde==='OUTRO'?false:true;
const ONDE_CAR={GALPÃO:'CARREGA NO GALPÃO NOSSO',OUTRO:'CARREGA EM OUTRA EMPRESA',EVENTO:'CARREGA NO EVENTO'};
const ONDE_DES={GALPÃO:'DESCARREGA NO GALPÃO',EVENTO:'DESCARREGA NO EVENTO'};
function ondeTxt(f,des){ return f.onde?'SÓ O QUE '+(des?ONDE_DES[f.onde]||'':ONDE_CAR[f.onde]):''; }
function carregamentosLista(per,f){ return ordCrono(itens.filter(it=>it.tipo==='VIAGEM'&&it.carData&&it.carData>=per.a&&it.carData<=per.b&&evOk(it)&&(!f.ev||it.eventoId===f.ev)&&ondeCar(it,f))); }
function descarregamentosLista(per,f){ return itens.filter(it=>it.tipo==='VIAGEM'&&desData(it)&&desData(it)>=per.a&&desData(it)<=per.b&&evOk(it)&&(!f.ev||it.eventoId===f.ev||(desOutroEv(it)&&it.desEvId===f.ev))&&ondeDes(it,f))
  .sort((a,b)=>{ const ka=dtk(desData(a),desHora(a)), kb=dtk(desData(b),desHora(b)); return ka<kb?-1:ka>kb?1:String(a.criadoEm||a.id).localeCompare(String(b.criadoEm||b.id)); }); }
function semCarregamento(f){ const t=hoje(); return ordCrono(itens.filter(it=>{ const ev=evById(it.eventoId); return it.tipo==='VIAGEM'&&!cancelado(it)&&!it.carData&&(!it.eventoId||evAtivo(ev))&&(!f.ev||it.eventoId===f.ev)&&ondeCar(it,f)&&(!it.saiData||(it.saiData>=addIso(t,-1)&&it.saiData<=addIso(t,60))); })); }
function semDescarregamento(f){ const t=hoje(); return ordCrono(itens.filter(it=>{ const ev=evById(it.eventoId); if(it.tipo!=='VIAGEM'||cancelado(it)||desData(it)) return false; if(it.eventoId&&!evAtivo(ev)) return false; if(f.ev&&it.eventoId!==f.ev) return false; if(!ondeDes(it,f)) return false; const base=it.saiData||it.carData; return !!base&&base>=addIso(t,-2)&&base<=addIso(t,60); })); }
function empResumo(lista,dia){
  const m=new Map(); lista.forEach(it=>{ if(cancelado(it)) return; const k=empKey(it); if(!k) return; let x=m.get(k); if(!x){ x={nm:empNome(it),hs:[],k:k}; m.set(k,x); } x.hs.push(it.carHora||'SEM HORA'); });
  return Array.from(m.values()).map(x=>{ const arr=((IX.uso.get(x.k)||new Map()).get(dia)||[]).filter(e=>e.aloc); const longe=arr.filter(e=>!e.first&&!e.last); return '<span><b>'+esc(x.nm)+'</b> · '+esc(x.hs.sort().join(' · '))+(longe.length?' <span class="bad">· ESTÁ NO '+esc(evNome(longe[0].ev))+(longe[0].prev?' (PREVISTO)':'')+'</span>':'')+'</span>'; }).join('');
