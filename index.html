/* separa o que carrega no EVENTO do que carrega no GALPÃO / OUTRA EMPRESA (e o descarregamento: galpão x evento) */

function proxTxt(tipo){ const t=hoje(); let best='';
  if(tipo==='car') itens.forEach(it=>{ if(it.tipo==='VIAGEM'&&!cancelado(it)&&it.carData>t&&evOk(it)&&(!best||it.carData<best)) best=it.carData; });
  else if(tipo==='des') itens.forEach(it=>{ if(it.tipo==='VIAGEM'&&!cancelado(it)&&desData(it)>t&&evOk(it)&&(!best||desData(it)<best)) best=desData(it); });
  else itens.forEach(it=>{ if(!ehTrab(it)||cancelado(it)||!evById(it.eventoId)) return; (it.tipo==='VIAGEM'?[it.saiData]:it.tipo==='EQUIP'?[it.de]:it.dias).forEach(d=>{ if(d&&d>t&&(!best||d<best)) best=d; }); });
  return best?' <button type="button" class="btn sm" data-goday="'+(tipo==='sai'?'sai':tipo)+'" data-k="'+best+'">Próximo: '+esc(fmtD(best))+' →</button>':''; }

/* ---------- saídas (cronograma de ida dos carros) ---------- */
function saidasLista(per,f){
  const out=[];
  itens.forEach(it=>{ const ev=evById(it.eventoId); if(!ev||(f.ev&&it.eventoId!==f.ev)) return; const inP=d=>d&&d>=per.a&&d<=per.b;
    if(it.tipo==='VIAGEM'&&f.tipos.CAMINHAO&&inP(it.saiData)) out.push({it:it,ev:ev,data:it.saiData,hora:it.saiHora,k:'CAMINHAO'});
    if(it.tipo==='CARRO'&&f.tipos.CARRO) it.dias.forEach(d=>{ if(inP(d)) out.push({it:it,ev:ev,data:d,hora:it.hora,k:'CARRO'}); });
    if(it.tipo==='EQUIP'&&f.tipos.EQUIP&&inP(it.de)) out.push({it:it,ev:ev,data:it.de,hora:it.vaiHora,k:'EQUIP'}); });
  const ko={CAMINHAO:0,EQUIP:1,CARRO:2};
  return out.sort((a,b)=>{ const ka=dtk(a.data,a.hora), kb=dtk(b.data,b.hora); return ka<kb?-1:ka>kb?1:(cancelado(a.it)?1:0)-(cancelado(b.it)?1:0)||ko[a.k]-ko[b.k]||itNome(a.it).localeCompare(itNome(b.it)); });
}

function calMes(){ return /^\d{4}-\d{2}$/.test(UI.cal.mes)?UI.cal.mes:hoje().slice(0,7); }
function fasesDia(ev,k){ return ['mont','ev','desm'].filter(f=>janelas(ev,f).some(x=>k>=x.a&&k<=x.b)); }

function usoCalendario(a,b){

  trabalho().forEach(it=>{ if(cancelado(it)) return; const ev=evById(it.eventoId); if(it.eventoId&&!evAtivo(ev)) return;

const donoTxt=r=>r&&r.dono&&r.dono!=='NOSSO'?r.dono+(tr(r.donoNome)?' · '+normName(r.donoNome):''):'';
function frotaGrupos(ds){
  const G={CAM:[],EQ:[],CAR:[]}, vistos=new Set();
  caminhoesCad().forEach(r=>{ G.CAM.push({key:'r:'+r.id,nm:vehName(r),sub:[donoTxt(r),r.cat==='EQUIP'?'EQUIPAMENTO QUE É CAMINHÃO':'',vehSpec(r),condutorDe(r)?'MOT. '+condutorDe(r):''].filter(Boolean).join(' · ')}); vistos.add('r:'+r.id); });
  equipCad().forEach(r=>{ if(vistos.has('r:'+r.id)) return; G.EQ.push({key:'r:'+r.id,nm:vehName(r),sub:[donoTxt(r),vehSpec(r),condutorDe(r)?'OPERADOR '+condutorDe(r):''].filter(Boolean).join(' · ')}); vistos.add('r:'+r.id); });

/* grava um pedaço do item e redesenha o que depende dele (devolve true se mudou) */
function setCampo(id,patch,opts){
  if(readOnly){ toast('Nesta tela dá só pra ver.',true); return false; }
  const it=itens.find(x=>x.id===id); if(!it) return false;
  const novo=normItem(Object.assign({},it,patch)); Object.keys(patch).forEach(k=>{ if(patch[k]===undefined) delete novo[k]; });
  if(same(normItem(it),novo)) return false;
  const o=Object.assign(novo,{atualizadoEm:nowIso(),atualizadoPor:meNome()||it.atualizadoPor||''});
  upsertLocal(o); agendar(id,350);
  buildIX();
  if(PANEL.open&&PANEL.id===id){ if(opts&&opts.full) panelSoon(); else panelSoft(); }
  /* lista de escolha: redesenha já (o foco continua nela). Campo de texto: o "change" vem no meio da troca
     de campo (Tab / clique) — redesenhar agora jogaria o cursor fora; espera o próximo quadro */
  if(opts&&opts.full) drawMain(true); else { pendMain=true; refresh(); }
  setStatus();
  return true;
}
function criarItem(tipo,evId,pre){
  const t=tipo==='LEVA'||tipo==='TRAZ'||tipo==='CAMINHAO'?'VIAGEM':tipo;
  const o={id:newId(),tipo:t,eventoId:evId||'',criadoEm:nowIso(),criadoPor:meNome(),atualizadoEm:nowIso(),atualizadoPor:meNome()};
  if(t==='VIAGEM'){ o.sentido=tipo==='TRAZ'?'TRAZ':'LEVA'; o.status='PROGRAMADO'; o.origem='PRÓPRIO'; }
  else if(t==='EQUIP'){ o.status='PROGRAMADA'; o.origem='NOSSA'; }
  else { o.status='PROGRAMADO'; o.dias=[]; o.saiDe='GALPÃO'; }
  Object.assign(o,pre||{}); if(t==='VIAGEM'&&!(pre&&pre.carLocal)) o.carLocal=o.sentido==='TRAZ'?'EVENTO':'GALPÃO';
  const it=normItem(o); upsertLocal(it); agendar(it.id,0); return it;
}
/* + Caminhão: uma linha nova no cronograma (no evento, ou no dia escolhido em Carregamentos) */
function addCaminhao(evId,dia,local){
  if(readOnly) return null;
  const pre={}; if(local==='EVENTO'||local==='OUTRO') pre.carLocal=local;
  if(dia){ pre.carData=dia; if(!evId&&UI.car.ev) evId=UI.car.ev; }
  else if(evId){ const l=ordCrono(itensDo(evId).filter(x=>x.tipo==='VIAGEM'&&x.sentido==='LEVA'&&!cancelado(x))); const u=l[l.length-1]; if(u){ if(u.carData) pre.carData=u.carData; if(u.saiData) pre.saiData=u.saiData; } }
  const it=criarItem(local==='EVENTO'?'TRAZ':'LEVA',evId,pre);
  FOCO={id:it.id,sel:evId?'select[data-pick]':'select[data-f="eventoId"]'};
  render();
  return it;
}

function programarPrevisto(kind,evId,id){
  const ev=evById(evId); if(!ev||readOnly) return; const p=previsto(ev); let criados=[];
  if(kind==='frete'){ const x=p.fretes.find(y=>y.id===id); if(!x) return; const f=x.f, v=x.v;
    const orig=v?(v.dono==='AGREGADO'?'AGREGADO':v.dono==='TERCEIRO'?'TERCEIRO':'PRÓPRIO'):(f.origem==='TERCEIRO'?'TERCEIRO':f.origem==='AGREGADO'?'AGREGADO':'PRÓPRIO');
    const nome=v?vehName(v):(x.dem?vehName(x.dem):normName(f.caminhao)), mot=v?condutorDe(v):demCondutor(x.dem);
    const mk=(s,i)=>criarItem(s,ev.id,{veiculoId:v?v.id:'',caminhao:nome,origem:orig,motorista:mot,[s==='TRAZ'?'traz':'leva']:x.oque||'',saiData:(s==='LEVA'?f.ida:f.volta)||'',link:{k:'frete',id:f.id,s:s,i:i,base:(s==='LEVA'?f.ida:f.volta)||''}});
    for(let i=x.leva.length;i<x.n;i++) criados.push(mk('LEVA',i));
    if(f.volta) for(let i=x.traz.length;i<x.n;i++) criados.push(mk('TRAZ',i)); }
  else if(kind==='equip'){ const x=p.equip.find(y=>y.id===id); if(!x||x.link.length) return; const q=x.q;
    criados.push(criarItem('EQUIP',ev.id,{equipId:x.r?x.r.id:'',equipTxt:x.r?vehName(x.r):(x.dem?vehName(x.dem):normName(q.nome)),origem:x.nossa?'NOSSA':'ALUGADA',fornecedor:normName(q.fornecedor),de:q.de||'',ate:q.ate||'',operador:x.r?condutorDe(x.r):demCondutor(x.dem),obs:isGeral(x.a)?'':'AMBIENTE: '+normName(x.a.nome),link:{k:'equip',id:q.id,amb:x.a.id,base:{de:q.de||'',ate:q.ate||''}}})); }
  else if(kind==='escala'){ const x=p.carros.find(y=>y.rid===id); if(!x||x.link.length) return;
    criados.push(criarItem('CARRO',ev.id,{veiculoId:x.own?x.own.id:'',carro:x.own?vehName(x.own):(x.veic?vehName(x.veic):''),motorista:normName(x.team.motorista)||(x.own?condutorDe(x.own):demCondutor(x.veic)),quem:'EQUIPE '+normName(x.team.nome),dias:x.dias.slice(),saiDe:'GALPÃO',link:{k:'escala',rid:x.rid,base:x.dias.slice()}})); }
  if(!criados.length) return;
  if(kind==='frete'){ FOCO={id:criados[0].id,sel:'[data-f="carData"]'}; render(); toast(plural(criados.length,'caminhão entrou','caminhões entraram')+' no cronograma — complete o dia e a hora do carregamento.'); return; }
  refresh(); abrirItem(criados[0].id);
}

function pdfSafe(s){
  return String(s==null?'':s).normalize('NFC').replace(/[‐-―−]/g,'-').replace(/[ -   　]/g,' ').replace(/[​-‍⁠﻿]/g,'').replace(/[•●▪]/g,'·').replace(/[✓✔]/g,'OK').replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/→/g,'->').replace(/←/g,'<-').replace(/…/g,'...').replace(/²/g,'2').replace(/³/g,'3').replace(/[◀▶↗]/g,'').toUpperCase().replace(/Μ/g,'µ').replace(/[^\x00-\xFF]/g,'');
}
function loadScriptOnce(src,test){ return new Promise((res,rej)=>{ if(test()) return res(test()); const s=document.createElement('script'); s.src=src; s.onload=()=>test()?res(test()):rej(new Error(src)); s.onerror=()=>rej(new Error(src)); document.head.appendChild(s); }); }
const loadJsPDF=()=>loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf&&window.jspdf.jsPDF);
const PDFJS_V='3.11.174', PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/pdf.min.js', PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/pdf.worker.min.js';
async function loadPdfJs(){ if(window.pdfjsLib&&window.pdfjsLib.getDocument) return window.pdfjsLib; await loadScriptOnce(PDFJS_WORKER,()=>!!(window.pdfjsWorker&&window.pdfjsWorker.WorkerMessageHandler)); await loadScriptOnce(PDFJS_URL,()=>!!window.pdfjsLib); const L=window.pdfjsLib; L.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; return L; }
const C={navy:[31,59,99],blue:[46,117,182],orange:[232,116,26],teal:[42,157,143],ink:[27,36,48],muted:[91,104,120],faint:[140,152,168],line:[211,218,228],white:[255,255,255],grey:[236,239,243],zebra:[246,248,251],warn:[184,98,27],ok:[46,139,87],bad:[185,58,47],des:[31,59,99]};
async function pdfNovo(orient){
  const JS=await loadJsPDF(); const o=orient||'landscape'; const doc=new JS({unit:'mm',format:'a4',orientation:o,compress:true});
  const P={doc:doc,o:o,W:o==='portrait'?210:297,H:o==='portrait'?297:210,M:10,y:10};
  P.CW=P.W-2*P.M; P.fill=c=>doc.setFillColor(c[0],c[1],c[2]); P.draw=c=>doc.setDrawColor(c[0],c[1],c[2]); P.tc=c=>doc.setTextColor(c[0],c[1],c[2]);
  P.font=(w,s)=>{ doc.setFont('helvetica',w); doc.setFontSize(s); }; P.T=(s,x,y,op)=>doc.text(pdfSafe(s),x,y,op||{}); P.wrap=(s,w)=>doc.splitTextToSize(pdfSafe(s),w);
  P.ensure=h=>{ if(P.y+h>P.H-P.M-6){ doc.addPage('a4',o); P.y=P.M+4; return true; } return false; };
  return P;
}

function pdfBarra(P,txt,dir,cor){ P.ensure(14); P.fill(cor||C.navy); P.doc.rect(P.M,P.y-4.6,P.CW,7,'F'); P.tc(C.white); P.font('bold',10); P.T(txt,P.M+3,P.y); if(dir){ P.font('bold',8.6); P.T(dir,P.W-P.M-3,P.y,{align:'right'}); } P.y+=7.2; }
function pdfTabela(P,cols,rows){
  const sw=cols.slice(0,-1).reduce((a,c)=>a+c.w,0); cols[cols.length-1].w=Math.max(18,P.CW-sw);
  const head=()=>{ P.font('bold',6.8); const ls=cols.map(c=>P.wrap(c.h,c.w-2.4-0.15*String(c.h).length)); const n=Math.max.apply(null,ls.map(l=>l.length||1)); const hh=n*3+3.2; P.ensure(hh+6); P.fill(C.grey); P.doc.rect(P.M,P.y-4.2,P.CW,hh,'F'); P.tc(C.muted); let x=P.M+1.6; ls.forEach((l,i)=>{ l.forEach((s,j)=>P.T(s,x,P.y+j*3,{charSpace:0.15})); x+=cols[i].w; }); P.y+=hh-1.2; };
  head();
  rows.forEach((r,ri)=>{
    const wr=r.c.map((v,ci)=>{ P.font(cols[ci].b?'bold':'normal',cols[ci].fs||7.8); return P.wrap(v==null?'':String(v),cols[ci].w-2.4); });
    const n=Math.max.apply(null,wr.map(w=>w.length||1)), rh=n*3.5+2.8;
    if(P.ensure(rh)) head();
    if(ri%2===1){ P.fill(C.zebra); P.doc.rect(P.M,P.y-3.4,P.CW,rh,'F'); }
    if(r.mark){ P.fill(r.mark); P.doc.rect(P.M,P.y-3.4,1.3,rh,'F'); }
    let x=P.M+2; wr.forEach((w,ci)=>{ P.font(cols[ci].b?'bold':'normal',cols[ci].fs||7.8); P.tc(r.cancel?C.faint:(r.cor&&r.cor[ci])||(cols[ci].mut?C.muted:C.ink)); w.forEach((l,j)=>P.T(l,x,P.y+j*3.5)); x+=cols[ci].w; });
    if(r.cancel){ P.draw(C.faint); P.doc.setLineWidth(0.2); P.doc.line(P.M+2,P.y-1,P.W-P.M-2,P.y-1); }
    P.draw(C.line); P.doc.setLineWidth(0.15); P.doc.line(P.M,P.y+rh-3.4,P.W-P.M,P.y+rh-3.4); P.y+=rh;
  });
  P.y+=4;
}
function pdfRodape(P,lbl){ const np=P.doc.getNumberOfPages(); for(let i=1;i<=np;i++){ P.doc.setPage(i); P.font('normal',7); P.tc(C.faint); P.draw(C.line); P.doc.setLineWidth(0.2); P.doc.line(P.M,P.H-8,P.W-P.M,P.H-8); P.T('GRUPO TENDAS PLENART  ·  LOGÍSTICA  ·  '+lbl,P.M,P.H-4.6); P.T('PÁGINA '+i+' DE '+np,P.W-P.M,P.H-4.6,{align:'right'}); } }

/* ====================== PRODUÇÃO E EQUIPES ======================
   cadastro  PESSOA {grupo:'EQUIPE'|'PROD', nome, lider, integrantes, contato, vinculo:'NOSSO'|'TERCEIRO', empresa, obs, ordem}
   alocação  ALOC   {grupo, pessoaId (do cadastro) ou nome+empresa digitados (terceirizado avulso), eventoId, fase:'mont'|'ev'|'desm'|'', de, ate, hora, funcao, obs} */
const G_INFO={EQUIPE:{key:'eqp',view:'equipes',um:'equipe',uns:'equipes',Um:'Equipe',titulo:'Equipes',ph:'EX: EQUIPE DO JARDEL'},PROD:{key:'prod',view:'producao',um:'produtor',uns:'produtores',Um:'Produtor',titulo:'Produção',ph:'EX: LUAN AZEVEDO'}};
const FASE_OP=[['','— ETAPA'],['mont','MONTAGEM'],['ev','EVENTO'],['desm','DESMONTAGEM']];

function pessoas(g){ return itens.filter(x=>x.tipo==='PESSOA'&&x.grupo===g).sort((a,b)=>((a.vinculo==='TERCEIRO')-(b.vinculo==='TERCEIRO'))||(num(a.ordem)-num(b.ordem))||String(a.nome).localeCompare(String(b.nome))); }

function alocKey(a){ const p=pessoa(a.pessoaId); if(p) return 'p:'+p.id; const n=chaveNome(a.nome); return n?'pt:'+a.grupo+':'+n:''; }
function alocTerc(a){ const p=pessoa(a.pessoaId); return p?p.vinculo==='TERCEIRO':true; }
function alocEmpresa(a){ const p=pessoa(a.pessoaId); return p?(p.vinculo==='TERCEIRO'?normName(p.empresa):''):normName(a.empresa); }
function alocDias(a){ if(!a.de&&!a.ate) return []; const ds=diasEntre(a.de||a.ate,a.ate||a.de); return ds.length>200?[]:ds; }
function alocsAtivas(g){ return itens.filter(x=>x.tipo==='ALOC'&&(!g||x.grupo===g)&&(!x.eventoId||evAtivo(evById(x.eventoId)))); }
function pessoaSub(p){ return [p.vinculo==='TERCEIRO'?'TERCEIRIZADO'+(tr(p.empresa)?' · '+normName(p.empresa):''):'NOSSO',tr(p.lider)?'LÍDER '+normName(p.lider):'',tr(p.contato)?normName(p.contato):''].filter(Boolean).join(' · '); }
/* índice: quem -> dia -> alocações (pra achar a mesma equipe/produtor em dois eventos no mesmo dia) */
function buildAloc(){ const M=new Map(); alocsAtivas().forEach(a=>{ const k=alocKey(a); if(!k) return; let m=M.get(k); if(!m){ m=new Map(); M.set(k,m); } alocDias(a).forEach(d=>{ let l=m.get(d); if(!l){ l=[]; m.set(d,l); } l.push(a); }); }); IX.aloc=M; }
function choqueAloc(a){ const k=alocKey(a), m=IX.aloc&&IX.aloc.get(k), por=new Map(); if(!m||!a.eventoId) return por;
  alocDias(a).forEach(d=>(m.get(d)||[]).forEach(o=>{ if(o.id===a.id||!o.eventoId||o.eventoId===a.eventoId) return; if(!por.has(o.eventoId)) por.set(o.eventoId,[]); const l=por.get(o.eventoId); if(l.indexOf(d)<0) l.push(d); })); return por; }
function avisosAloc(a){
  const out=[]; const ev=a.eventoId?evById(a.eventoId):null;
  if(a.eventoId&&!ev){ out.push({sev:'bad',txt:'O EVENTO DESSA ALOCAÇÃO FOI EXCLUÍDO'}); return out; }
  choqueAloc(a).forEach((ds,eid)=>out.push({sev:'warn',txt:(a.grupo==='PROD'?'ESSE PRODUTOR':'ESSA EQUIPE')+' TAMBÉM ESTÁ NO '+evNome(evById(eid))+' · '+ds.sort().map(d=>fmtDM(d)).join(', ')}));
  if(a.de&&a.ate&&a.ate<a.de) out.push({sev:'warn',txt:'O "ATÉ" ESTÁ ANTES DO "DE"'});
  if(ev&&a.de){ const p=evPer(ev); if(p&&(a.de<addIso(p.a,-10)||(a.ate||a.de)>addIso(p.b,10))) out.push({sev:'info',txt:'DIAS LONGE DAS DATAS DO EVENTO'}); }
  const falta=[]; if(!a.eventoId) falta.push('EVENTO'); if(!alocNome(a)) falta.push(a.grupo==='PROD'?'PRODUTOR':'EQUIPE'); if(!a.de&&!a.ate) falta.push('DIAS');
  if(falta.length) out.push({sev:'info',txt:'FALTA: '+falta.join(' · ')});

}
function criarAloc(g,pre){ const o=normItem(Object.assign({id:newId(),tipo:'ALOC',grupo:g,eventoId:'',fase:'',de:'',ate:'',hora:'',funcao:'',obs:'',criadoEm:nowIso(),criadoPor:meNome(),atualizadoEm:nowIso(),atualizadoPor:meNome()},pre||{})); upsertLocal(o); agendar(o.id,0); return o; }
function criarPessoa(g){ const n=pessoas(g).length; const o=normItem({id:newId(),tipo:'PESSOA',grupo:g,nome:'',vinculo:'NOSSO',ordem:n+1,criadoEm:nowIso(),criadoPor:meNome(),atualizadoEm:nowIso(),atualizadoPor:meNome()}); upsertLocal(o); agendar(o.id,0); return o; }
/* datas da etapa escolhida (a primeira janela de montagem / evento / desmontagem) */

function patchAloc(it,k,v){

  h+='<p class="hint frhint">Cadastre '+(eq?'as equipes':'os produtores')+' (nossos e terceirizados). Eles aparecem pra escolher na escala e dentro dos eventos. Terceirizado que aparece uma vez só dá pra digitar direto na alocação.</p>';

  const usos=new Map(); itens.forEach(a=>{ if(a.tipo==='ALOC'&&a.pessoaId) usos.set(a.pessoaId,(usos.get(a.pessoaId)||0)+1); });
  const head='<div class="phead'+(eq?' eq':'')+'" aria-hidden="true"><span>Nome</span>'+(eq?'<span>Líder</span><span>Integrantes</span>':'')+'<span>Telefone</span><span>Nosso ou terceirizado</span><span>Observação</span><span></span></div>';
  [['NOSSOS',ps.filter(p=>p.vinculo!=='TERCEIRO')],['TERCEIRIZADOS',ps.filter(p=>p.vinculo==='TERCEIRO')]].forEach(([tt,l])=>{ if(!l.length) return;
    h+='<div class="dgrp"><div class="dh"><b>'+esc(tt)+'</b><span>'+plural(l.length,I.um,I.uns)+'</span></div><div class="plist">'+head+l.map(p=>{ const n=usos.get(p.id)||0, dis=ro?' disabled':'';
      const inp=(k,ph,lbl)=>'<input type="text" data-f="'+k+'" value="'+esc(p[k])+'" placeholder="'+esc(ph)+'" aria-label="'+esc(lbl)+'" autocomplete="off"'+dis+'>';
      let r='<div class="crow pesrow'+(eq?' eq':'')+'" data-row="'+esc(p.id)+'">'
        +'<label class="c c-nome"><span>Nome</span>'+inp('nome',I.ph,'Nome')+(n?'<small>'+plural(n,'ALOCAÇÃO','ALOCAÇÕES')+'</small>':'')+'</label>'
        +(eq?'<label class="c"><span>Líder</span>'+inp('lider','QUEM COMANDA','Líder')+'</label><label class="c"><span>Integrantes</span>'+inp('integrantes','EX: ZÉ, TIÃO, MARCOS','Integrantes')+'</label>':'')
        +'<label class="c"><span>Telefone</span>'+inp('contato','(21) 9…','Telefone')+'</label>'
        +'<div class="c c-dono"><span>Nosso ou terceirizado</span><div class="dw"><select data-f="vinculo" aria-label="Nosso ou terceirizado"'+dis+'><option value="NOSSO"'+(p.vinculo!=='TERCEIRO'?' selected':'')+'>NOSSO</option><option value="TERCEIRO"'+(p.vinculo==='TERCEIRO'?' selected':'')+'>TERCEIRIZADO</option></select>'+(p.vinculo==='TERCEIRO'?inp('empresa','EMPRESA','Empresa'):'')+'</div></div>'
        +'<label class="c"><span>Observação</span>'+inp('obs','','Observação')+'</label>'
        +'<div class="c c-act">'+(ro?'':'<button type="button" class="ib x2" data-act="tirar" title="Tirar do cadastro" aria-label="Tirar do cadastro">×</button>')+'</div>';
      if(ROWDEL===p.id) r+='<div class="confirm">Tirar '+esc(normName(p.nome)||'esse cadastro')+'?'+(n?' As alocações continuam, com o nome escrito.':'')+'<button type="button" class="btn danger solid sm" data-act="tirar-sim">Tirar</button><button type="button" class="btn sm" data-act="tirar-nao">Cancelar</button></div>';
      return r+'</div>'; }).join('')+'</div></div>'; });
  return h;
}
/* calendário: o que mostrar */
const CAL_F=[['ev','Eventos'],['car','Carregamentos'],['des','Descarregamentos'],['emp','Empilhadeiras'],['prod','Produção'],['eqp','Equipes']];
function calF(){ const f=isObj(UI.cal.f)?UI.cal.f:{}; const on=CAL_F.filter(([k])=>f[k]).map(([k])=>k); return on.length?on:CAL_F.map(([k])=>k); }
const calTudo=()=>calF().length===CAL_F.length;
function calFiltroHTML(){ const on=calF(), tudo=calTudo(); return '<div class="seg calf" role="group" aria-label="O que ver no calendário"><button type="button" data-calf="" class="'+(tudo?'on':'')+'" aria-pressed="'+tudo+'">Tudo</button>'+CAL_F.map(([k,l])=>{ const o=!tudo&&on.indexOf(k)>=0; return '<button type="button" data-calf="'+k+'" class="'+(o?'on':'')+'" aria-pressed="'+o+'">'+l+'</button>'; }).join('')+'</div>'; }
function calClick(k){ if(!k){ UI.cal.f={}; return; } const on=calF(); let nv; if(calTudo()) nv=[k]; else nv=on.indexOf(k)>=0?on.filter(x=>x!==k):on.concat([k]); UI.cal.f={}; nv.forEach(x=>UI.cal.f[x]=true); }
function calContagem(a,b){
  const M=new Map(); const add=(d,g,id)=>{ if(!d||d<a||d>b) return; let o=M.get(d); if(!o){ o={car:new Set(),des:new Set(),emp:new Set(),prod:new Set(),eqp:new Set(),carro:new Set()}; M.set(d,o); } o[g].add(id); };
  trabalho().forEach(it=>{ if(cancelado(it)) return; const ev=evById(it.eventoId); if(it.eventoId&&!evAtivo(ev)) return;
    if(it.tipo==='VIAGEM'){ add(it.carData,'car',it.id); add(desData(it),'des',it.id); }
    else if(it.tipo==='EQUIP') eqDias(it).forEach(d=>add(d,'emp',it.id));
    else it.dias.forEach(d=>add(d,'carro',it.id)); });
  alocsAtivas().forEach(x=>{ const k=alocKey(x)||x.id; alocDias(x).forEach(d=>add(d,x.grupo==='PROD'?'prod':'eqp',k)); });
  return M;
}
const CAL_TXT={car:['CARREG.','CARREG.'],des:['DESCARREG.','DESCARREG.'],emp:['EMPILH.','EMPILH.'],prod:['PRODUTOR','PRODUTORES'],eqp:['EQUIPE','EQUIPES'],carro:['CARRO','CARROS']};
function calCntHTML(u){ if(!u) return ''; const ks=calF().filter(k=>k!=='ev').concat(calTudo()?['carro']:[]); return ks.filter(k=>u[k].size).map(k=>'<span class="cc cc-'+k+'">'+u[k].size+' '+CAL_TXT[k][u[k].size>1?1:0]+'</span>').join(''); }

/* ---------- filtro por equipe / produtor ---------- */
function pesLista(g){ const out=pessoas(g).map(p=>({key:'p:'+p.id,nome:normName(p.nome)||'(SEM NOME)',g:g})); const vis=new Set(out.map(o=>o.key)); alocsAtivas(g).forEach(a=>{ const k=alocKey(a); if(k&&!vis.has(k)){ vis.add(k); out.push({key:k,nome:alocNome(a)+' (TERCEIRIZADO)',g:g}); } }); return out; }
function pesNomeKey(k){ for(const g of ['EQUIPE','PROD']){ const o=pesLista(g).find(x=>x.key===k); if(o) return o.nome; } return ''; }
function pesSelHTML(attr,val,gs){ return '<label class="sel">'+(gs.length>1?'Equipe / produtor':G_INFO[gs[0]].Um)+' <select '+attr+'><option value="">Todos</option>'+gs.map(g=>{ const l=pesLista(g); return l.length?'<optgroup label="'+(g==='PROD'?'PRODUÇÃO':'EQUIPES')+'">'+l.map(o=>'<option value="'+esc(o.key)+'"'+(o.key===val?' selected':'')+'>'+esc(o.nome)+'</option>').join('')+'</optgroup>':''; }).join('')+'</select></label>'; }
const calPes=()=>UI.cal.pes&&pesNomeKey(UI.cal.pes)?UI.cal.pes:'';
const alocDe=k=>alocsAtivas().filter(a=>alocKey(a)===k);
function alocDiasTxt(a){ return a.de?(a.ate&&a.ate!==a.de?fmtD(a.de)+' A '+fmtD(a.ate):fmtD(a.de)):'SEM DIA'; }

/* ---------- PDF: relatório do calendário (o mês, com o que está filtrado) ---------- */
async function pdfCalendario(){
  let P; try{ P=await pdfNovo('landscape'); }catch(e){ toast('Não consegui carregar o gerador de PDF (internet?).',true); return; }
  const m=calMes(), Y=+m.slice(0,4), Mo=+m.slice(5,7), nD=new Date(Y,Mo,0).getDate(), prim=m+'-01', fim=m+'-'+pad2(nD), mt=MESES_L[Mo-1]+' '+Y, pes=calPes();
  if(pes){
    const nm=pesNomeKey(pes), l=ordAloc(alocDe(pes).filter(a=>alocDias(a).some(d=>d>=prim&&d<=fim)));
    const dias=new Set(); l.forEach(a=>alocDias(a).forEach(d=>{ if(d>=prim&&d<=fim) dias.add(d); }));
    pdfCab(P,'AGENDA · '+nm,'MÊS DE '+mt,plural(dias.size,'DIA OCUPADO','DIAS OCUPADOS')+' DE '+nD);
    if(!l.length){ P.font('bold',11); P.tc(C.muted); P.T('NADA ALOCADO NESSE MÊS.',P.M,P.y+4); }
    else pdfTabela(P,[{h:'DIAS',w:34,b:true},{h:'EVENTO',w:58,b:true},{h:'LOCAL',w:62,mut:true,fs:7.2},{h:'ETAPA',w:26},{h:'HORA',w:14},{h:'O QUE FAZ',w:40}],
      l.map(a=>{ const e=evById(a.eventoId); return {c:[alocDiasTxt(a),e?evNome(e):'SEM EVENTO',e?normName(e.local)||'-':'-',a.fase?PHN[a.fase]:'-',a.hora||'-',normName(a.funcao)||'-'],mark:e?hex(evCor(e.id)):C.line}; }));
    pdfRodape(P,'AGENDA · '+nm+' · '+mt);
    abrirPDF('AGENDA_'+pdfSafe(nm).replace(/[^A-Z0-9]+/g,'-').slice(0,40)+'_'+m.replace('-','')+'.pdf',P.doc.output('arraybuffer'));
    return;
  }
  const F=calF(), fo=x=>F.indexOf(x)>=0, tudo=calTudo();
  pdfCab(P,'CALENDÁRIO · '+mt,tudo?'TUDO':'MOSTRANDO: '+CAL_F.filter(([x])=>fo(x)).map(([,l])=>l).join(', '),'');
  let algum=false;
  diasEntre(prim,fim).forEach(d=>{
    const rows=[];
    if(fo('ev')) evsAtivos().forEach(e=>{ const fs=fasesDia(e,d); if(fs.length) rows.push({o:'0',c:['','EVENTO',evNome(e),fs.map(f=>({mont:'EM MONTAGEM',ev:'DIA DE EVENTO',desm:'EM DESMONTAGEM'})[f]).join(' + '),normName(e.local)||'-'],mark:hex(evCor(e.id))}); });
    trabalho().forEach(it=>{ if(cancelado(it)) return; const e=evById(it.eventoId); if(it.eventoId&&!evAtivo(e)) return; const en=e?evNome(e):'SEM EVENTO', mk=e?hex(evCor(e.id)):C.line;
      if(it.tipo==='VIAGEM'){
        if(fo('car')&&it.carData===d) rows.push({o:'1'+(it.carHora||'99'),c:[it.carHora||'-','CARREGAMENTO',en,truckNome(it)+(tr(it.motorista)?'\nMOT. '+normName(it.motorista):''),'CARREGA '+localCar(it)+(tr(it.destino)?' · DESTINO '+normName(it.destino):'')],mark:mk});
        if(fo('des')&&desData(it)===d){ const gal=desNoGalpao(it), hh=gal?it.volHora:it.cheHora; rows.push({o:'2'+(hh||'99'),c:[hh||'-','DESCARREGAMENTO',en,truckNome(it),(gal?'NO GALPÃO':'NO EVENTO')+(desCarga(it)?' · '+desCarga(it).replace(/\n/g,' / '):'')],mark:mk}); }
      } else if(it.tipo==='EQUIP'){ if(fo('emp')&&eqDias(it).indexOf(d)>=0) rows.push({o:'3',c:['','EMPILHADEIRA',en,itNome(it),tr(it.motorista)?'OPERADOR '+normName(it.motorista):'-'],mark:mk}); }
      else if(tudo&&it.dias.indexOf(d)>=0) rows.push({o:'6',c:[it.hora||'-','CARRO',en,itNome(it)+(tr(it.motorista)?'\nMOT. '+normName(it.motorista):''),normArea(it.leva)||'-'],mark:mk}); });
    alocsAtivas().forEach(a=>{ if(alocDias(a).indexOf(d)<0) return; const g=a.grupo==='PROD'?'prod':'eqp'; if(!fo(g)) return; const e=evById(a.eventoId);
      rows.push({o:(g==='prod'?'4':'5')+(a.hora||'99'),c:[a.hora||'-',g==='prod'?'PRODUTOR':'EQUIPE',e?evNome(e):'SEM EVENTO',alocNome(a)+(alocTerc(a)?' (TERCEIRIZADO'+(alocEmpresa(a)?' · '+alocEmpresa(a):'')+')':''),[a.fase?PHN[a.fase]:'',normName(a.funcao)].filter(Boolean).join(' · ')||'-'],mark:e?hex(evCor(e.id)):C.line}); });
    if(!rows.length) return; algum=true;
    rows.sort((x,y)=>x.o<y.o?-1:x.o>y.o?1:0);
    P.ensure(30); pdfBarra(P,fmtDL(d),plural(rows.length,'ITEM','ITENS'));
    pdfTabela(P,[{h:'HORA',w:13,b:true,fs:8.6},{h:'O QUE',w:32,b:true,fs:7.2},{h:'EVENTO',w:62,b:true},{h:'QUEM / QUAL',w:72},{h:'DETALHE',w:40,mut:true,fs:7.4}],rows);
  });
  if(!algum){ P.font('bold',11); P.tc(C.muted); P.T('NADA NESSE MÊS COM ESSE FILTRO.',P.M,P.y+4); }
  pdfRodape(P,'CALENDÁRIO · '+mt);
  abrirPDF('CALENDARIO_'+m.replace('-','')+'.pdf',P.doc.output('arraybuffer'));
}

/* ---------- PDF: escala das equipes / da produção ---------- */
async function pdfEscala(g){
  let P; try{ P=await pdfNovo('landscape'); }catch(e){ toast('Não consegui carregar o gerador de PDF (internet?).',true); return; }
  const I=G_INFO[g], U=uiG(g), per=periodo(U), pes=U.pes&&pesNomeKey(U.pes)?U.pes:'';
  const lista=alocsAtivas(g).filter(a=>(!U.ev||a.eventoId===U.ev)&&(!pes||alocKey(a)===pes)&&alocDias(a).some(d=>d>=per.a&&d<=per.b));
  pdfCab(P,'ESCALA '+(g==='PROD'?'DA PRODUÇÃO':'DAS EQUIPES'),perTxt(per),[filtroEvTxt(U.ev),pes?'SÓ '+pesNomeKey(pes):''].filter(Boolean).join(' · '));
  if(!lista.length){ P.font('bold',11); P.tc(C.muted); P.T('NINGUÉM ALOCADO NESSE PERÍODO.',P.M,P.y+4); pdfRodape(P,'ESCALA · '+perTxt(per)); abrirPDF(pdfNome('ESCALA-'+I.uns.toUpperCase(),per),P.doc.output('arraybuffer')); return; }
  const by=new Map(); lista.forEach(a=>{ const k=alocKey(a)||a.id; if(!by.has(k)) by.set(k,[]); by.get(k).push(a); });
  const ordem=pesLista(g).map(o=>o.key).filter(k=>by.has(k)).concat(Array.from(by.keys()).filter(k=>!pesLista(g).some(o=>o.key===k)));
  const nomeK=k=>{ const a=by.get(k)[0], p=pessoa(a.pessoaId); return alocNome(a)+(p?(p.vinculo==='TERCEIRO'?' (TERCEIRIZADO'+(tr(p.empresa)?' · '+normName(p.empresa):'')+')':''):' (TERCEIRIZADO'+(alocEmpresa(a)?' · '+alocEmpresa(a):'')+')'); };
  /* quadro: dia e semana (no mês fica só a lista, não cabe na folha) */
  if(per.modo!=='mes'){
    const ds=diasEntre(per.a,per.b), wN=ds.length>1?Math.floor((P.CW-58)/ds.length):P.CW-58;
    pdfSub(P,'QUADRO',plural(ordem.length,I.um.toUpperCase(),I.uns.toUpperCase()));
    pdfTabela(P,[{h:I.Um.toUpperCase(),w:58,b:true,fs:7.6}].concat(ds.map(d=>({h:DIAS3[parseISO(d).getDay()]+' '+fmtDM(d),w:wN,fs:7}))),
      ordem.map(k=>({c:[nomeK(k)].concat(ds.map(d=>by.get(k).filter(a=>alocDias(a).indexOf(d)>=0).map(a=>{ const e=evById(a.eventoId); return (e?sigla(e.id):'?')+(a.fase?' '+FASE_L[a.fase]:'')+(a.hora?' '+a.hora:''); }).join('\n')||'-'))})));
    const evs=Array.from(new Set(lista.map(a=>a.eventoId).filter(Boolean)));
    if(evs.length){ P.font('normal',7.4); P.tc(C.muted); const txt=evs.map(id=>sigla(id)+' = '+evNome(evById(id))).join('   ·   ')+'   ·   M MONTAGEM · E EVENTO · D DESMONTAGEM'; P.wrap(txt,P.CW).forEach(l=>{ P.ensure(5); P.T(l,P.M,P.y); P.y+=3.6; }); P.y+=4; }
  }
  pdfSub(P,'DETALHE POR '+I.um.toUpperCase(),'');
  ordem.forEach(k=>{ const l=ordAloc(by.get(k)); P.ensure(30); pdfBarra(P,nomeK(k),plural(l.length,'ALOCAÇÃO','ALOCAÇÕES'));
    pdfTabela(P,[{h:'DIAS',w:34,b:true},{h:'EVENTO',w:58,b:true},{h:'LOCAL',w:62,mut:true,fs:7.2},{h:'ETAPA',w:26},{h:'HORA',w:14},{h:'O QUE FAZ',w:40}],
      l.map(a=>{ const e=evById(a.eventoId); return {c:[alocDiasTxt(a),e?evNome(e):'SEM EVENTO',e?normName(e.local)||'-':'-',a.fase?PHN[a.fase]:'-',a.hora||'-',normName(a.funcao)||'-'],mark:e?hex(evCor(e.id)):C.line}; })); });
  pdfRodape(P,'ESCALA '+(g==='PROD'?'DA PRODUÇÃO':'DAS EQUIPES')+' · '+perTxt(per));
  abrirPDF(pdfNome('ESCALA-'+(g==='PROD'?'PRODUCAO':'EQUIPES'),per),P.doc.output('arraybuffer'));
}

/* ---------- PDF: lista de eventos (o que está na tela) ---------- */

  const G=gruposEventos(), filt={proximos:'AGORA E PRÓXIMOS',todos:'TODOS',arquivados:'ARQUIVADOS'}[UI.evf]||'';

      l.map(e=>{ const its=itens.filter(x=>ehTrab(x)&&x.eventoId===e.id&&!cancelado(x)), al=itens.filter(x=>x.tipo==='ALOC'&&x.eventoId===e.id);
        const nm=gr=>al.filter(a=>a.grupo===gr).map(a=>alocNome(a)).filter(Boolean); const uq=a=>Array.from(new Set(a));
        return {c:[evNome(e)+(tr(e.contato)?'\n'+normName(e.contato):''),normName(e.local)||'-',jt(e,'mont'),jt(e,'ev'),jt(e,'desm'),String(its.filter(x=>x.tipo==='VIAGEM').length),String(its.filter(x=>x.tipo==='EQUIP').length),uq(nm('EQUIPE')).join('\n')||'-',uq(nm('PROD')).join('\n')||'-'],mark:hex(evCor(e.id))}; })); });
  pdfRodape(P,'EVENTOS');
  abrirPDF('EVENTOS_'+hoje().replace(/-/g,'')+'.pdf',P.doc.output('arraybuffer'));
}
